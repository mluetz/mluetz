<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23FED22C'/%3E%3Ctext x='8' y='12' font-size='10' text-anchor='middle' font-family='Arial' font-weight='bold'%3E!%3C/text%3E%3C/svg%3E">
<title>REUTIB · Incident Response Management (IRM) V1.10</title>
<style>
:root{
  --rot:#E30513;      /* nur Logo/Wortmarke */
  --gelb:#FED22C;
  --anthrazit:#3E3E3E;
  --grau:#5A5859;
  --hellgrau:#F0F0F0;
  --ok:#2e7d32;
  --warn:#b26a00;
  --crit:#8e0000;
  --line:#d7d7d7;
  --bg:#fff;
  --fg:#000;
  --soft:#fafafa;
  --head:#3E3E3E;
  --headfg:#fff;
}
:root[data-theme=dark]{
  --anthrazit:#c9c9c9;
  --grau:#a5a3a4;
  --hellgrau:#242424;
  --ok:#6fbf73;
  --warn:#e0a437;
  --crit:#e57373;
  --line:#3d3d3d;
  --bg:#161616;
  --fg:#ececec;
  --soft:#1d1d1d;
  --head:#2e2e2e;
  --headfg:#ececec;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Roboto Condensed","Arial Narrow",Arial,sans-serif;color:var(--fg);background:var(--bg);font-size:15px}
header{background:var(--bg);border-bottom:3px solid var(--gelb);padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{font-weight:700;font-size:20px;letter-spacing:.5px}
.brand .r{color:var(--rot)}
.brand small{display:block;font-weight:400;color:var(--grau);font-size:12px;letter-spacing:0}
.spacer{flex:1}
select,input,textarea,button{font-family:inherit;font-size:14px}
select,input[type=text],input[type=datetime-local],input[type=date],textarea{border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:var(--bg);color:var(--fg);width:100%}
textarea{min-height:64px;resize:vertical}
label{display:block;font-weight:700;font-size:12.5px;color:var(--anthrazit);margin:10px 0 3px}
label .req{color:var(--warn)}
label .hint{font-weight:400;color:var(--grau)}
button{cursor:pointer;border:1px solid var(--anthrazit);background:var(--head);color:var(--headfg);border-radius:4px;padding:7px 14px;font-weight:700}
button.sec{background:var(--bg);color:var(--anthrazit)}
button.acc{background:var(--gelb);color:#000;border-color:var(--gelb)}
button:disabled{opacity:.45;cursor:not-allowed}
.mini{padding:4px 9px;font-size:13px}
nav{background:var(--hellgrau);padding:0 18px;display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav button{background:none;border:none;color:var(--anthrazit);padding:11px 14px;border-radius:0;border-bottom:3px solid transparent;font-weight:700}
nav button.active{border-bottom-color:var(--gelb);background:var(--bg)}
main{padding:18px;max-width:1400px;margin:0 auto}
h1{font-size:21px;margin:.2em 0 .5em}
h2{font-size:17px;margin:1.2em 0 .4em}
h3{font-size:14.5px;margin:1em 0 .3em;color:var(--anthrazit)}
.rolebox{display:flex;align-items:center;gap:8px;background:var(--hellgrau);border-radius:6px;padding:5px 10px}
.rolebox b{font-size:12.5px;color:var(--anthrazit)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:14px 0}
.card{border:1px solid var(--line);border-radius:8px;padding:16px;background:var(--bg)}
.card.portal{cursor:pointer;border-top:4px solid var(--gelb)}
.card.portal:hover{background:var(--hellgrau)}
.card.portal h3{margin-top:0;font-size:16px;color:var(--fg)}
.card.danger{border-top-color:var(--anthrazit)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.kpi{background:var(--hellgrau);border-radius:8px;padding:12px}
.kpi .v{font-size:26px;font-weight:700}
.kpi .l{font-size:12px;color:var(--grau);font-weight:700}
table{border-collapse:collapse;width:100%;margin:8px 0;background:var(--bg)}
th{background:var(--head);color:var(--headfg);text-align:left;font-size:12.5px;padding:7px 9px;position:sticky;top:0}
td{border-bottom:1px solid var(--line);padding:7px 9px;font-size:13.5px;vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--hellgrau)}
tr:nth-child(even) td{background:var(--soft)}
.badge{display:inline-block;border-radius:10px;padding:1.5px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.p1{background:#000;color:#fff;border:1px solid #666}
.p2{background:#3E3E3E;color:#fff}
.p3{background:#5A5859;color:#fff}
.p4{background:var(--hellgrau);color:var(--fg);border:1px solid var(--line)}
:root[data-theme=dark] .p1{background:#ececec;color:#111;border:1px solid #ececec}
.pn{background:var(--bg);color:var(--grau);border:1px dashed var(--grau)}
.e0{background:var(--hellgrau);color:var(--fg)}
.e1{background:var(--gelb);color:#000}
.e2{background:#3E3E3E;color:#fff;border:1px solid #777}
.e3{background:#000;color:#fff;border:1px solid #777}
:root[data-theme=dark] .e3{background:#ececec;color:#111}
.st{background:var(--hellgrau);border:1px solid var(--line);color:var(--fg)}
.dom{background:var(--bg);border:1px solid var(--anthrazit);color:var(--anthrazit)}
.lock{background:var(--head);color:var(--headfg)}
.amp{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.amp.g{background:var(--ok)}.amp.y{background:var(--gelb);border:1px solid #b29200}.amp.o{background:var(--warn)}.amp.r{background:var(--crit)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 22px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
.section{border:1px solid var(--line);border-radius:8px;margin:14px 0;background:var(--bg)}
.section>.head{background:var(--hellgrau);padding:9px 14px;font-weight:700;color:var(--anthrazit);border-radius:8px 8px 0 0;display:flex;align-items:center;gap:10px}
.section>.body{padding:6px 14px 14px}
.note{background:var(--hellgrau);border-left:4px solid var(--gelb);padding:9px 12px;margin:10px 0;font-size:13.5px}
.err{background:var(--hellgrau);border-left:4px solid var(--crit);padding:9px 12px;margin:10px 0;font-size:13.5px;color:var(--fg);font-weight:700}
.oklight{border-left-color:var(--ok)}
.muted{color:var(--grau)}
.small{font-size:12.5px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:10px 0}
.filter>div{min-width:140px}
.statusflow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center}
.statusflow .chip{padding:5px 10px;border-radius:14px;border:1px solid var(--line);font-size:12.5px;background:var(--bg)}
.statusflow .chip.cur{background:var(--gelb);border-color:var(--gelb);font-weight:700;color:#000}
.log{font-size:12.5px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--soft)}
.log div{padding:2px 0;border-bottom:1px dotted var(--line)}
.taskrow.done{opacity:.55;text-decoration:line-through}
footer{padding:20px;text-align:center;color:var(--grau);font-size:12px;border-top:1px solid var(--line);margin-top:30px}
a{color:var(--anthrazit)}
.help{cursor:help;border-bottom:1px dotted var(--grau)}
dialog{border:1px solid var(--anthrazit);border-radius:8px;max-width:560px;padding:18px;background:var(--bg);color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.matrix td.n0{color:var(--line)}
details{border:1px solid var(--line);border-radius:8px;margin:10px 0;background:var(--bg)}
details>summary{cursor:pointer;font-weight:700;color:var(--anthrazit);padding:10px 14px;background:var(--hellgrau);border-radius:8px;list-style-position:inside}
details[open]>summary{border-radius:8px 8px 0 0}
details>.dbody{padding:4px 14px 12px}
.tip{position:relative;cursor:help}
.tip:hover::after{content:attr(data-tip);position:absolute;left:0;bottom:calc(100% + 7px);background:#3E3E3E;color:#fff;padding:5px 10px;border-radius:5px;font-size:12.5px;font-weight:400;white-space:nowrap;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.35);pointer-events:none}
.tip:hover::before{content:"";position:absolute;left:12px;bottom:calc(100% + 2px);border:5px solid transparent;border-top-color:#3E3E3E;z-index:50;pointer-events:none}
th.tip{position:sticky;cursor:help}
.langbtn{border:1px solid var(--line);background:var(--bg);color:var(--grau);padding:5px 9px;font-weight:700}
.langbtn.on{background:var(--gelb);color:#000;border-color:var(--gelb)}
.logo{height:52px;display:block;background:#fff;border-radius:6px;padding:3px 8px;border:1px solid var(--line);margin-left:auto}
@media(max-width:1480px){.logo{height:42px}}
@media print{header,nav,.noprint{display:none}}
</style>
</head>
<body>
<header>
  <div class="brand">Incident Response Management (IRM) · <span class="r">REUTTER</span> GROUP <span style="color:var(--grau)">Global</span> <small id="brandSub"></small></div>
  <div class="spacer"></div>
  <div class="rolebox noprint">
    <b id="roleLbl"></b>
    <select id="roleSel" onchange="setRole()"></select>
    <select id="roleDom" onchange="setRole()" style="display:none;width:auto"></select>
  </div>
  <div class="flex noprint">
    <span id="netBadge" class="badge st"></span>
    <button class="langbtn mini" id="btnDe" onclick="setLang('de')">DE</button>
    <button class="langbtn mini" id="btnEn" onclick="setLang('en')">EN</button>
    <button class="sec mini" id="btnTheme" onclick="toggleTheme()" title="Hell/Dunkel – Light/Dark">🌓</button>
    <button class="sec mini" id="btnExp" onclick="exportJson()"></button>
    <button class="sec mini" id="btnImp" onclick="document.getElementById('impFile').click()"></button>

const attCatLabel=c=>{const e=ATTCATS.find(x=>x[0]===c);return e?tr(e[1]):c;};
const hasAtt=(t,c)=>(t.anhaenge||[]).some(a=>a.cat===c);
const fmtSize=n=>n>=1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";
function readFileAsAtt(file,cat){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res({id:Math.random().toString(36).slice(2),cat,name:file.name,size:file.size,ts:now(),who:(S.user?S.user+" – ":"")+roleLabel(),data:r.result});
    r.onerror=rej; r.readAsDataURL(file);
  });
}
async function addAtt(){
  const t=T(); if(!t||!canEdit(t)) return;
  const inp=$("attFile"), cat=$("attCat").value;
  if(!inp||!inp.files.length){ alert(tr("Bitte zuerst eine Datei wählen.")); return; }
  t.anhaenge=t.anhaenge||[];
  for(const f of inp.files){
    if(f.size>2*1048576){ alert(tr("Datei zu groß (max. 2 MB):")+" "+f.name); continue; }
    if(t.anhaenge.reduce((a,x)=>a+x.size,0)+f.size>4*1048576){ alert(tr("Anlagenbudget des Tickets erschöpft (max. 4 MB gesamt).")); break; }
    const att=await readFileAsAtt(f,cat);
    t.anhaenge.push(att);
    log(t,tr("Anlage hinzugefügt:")+" "+att.name+" ("+attCatLabel(cat)+", "+fmtSize(att.size)+")");
  }
  inp.value="";
  save(t); render();
}
function delAtt(id){
  const t=T(); if(!t) return;
  if(S.role!=="isb"){ alert(tr("Entfernen von Anlagen nur durch den ISB.")); return; }
  const att=(t.anhaenge||[]).find(x=>x.id===id); if(!att) return;
  if(!confirm(tr("Anlage wirklich entfernen? Der Vorgang wird protokolliert."))) return;
  t.anhaenge=t.anhaenge.filter(x=>x.id!==id);
  log(t,tr("Anlage entfernt (ISB):")+" "+att.name);
  save(t); render();
}

function nis2(t){
  if(!t.nis2) t.nis2={sysbezug:"nicht geprüft", sysbegr:"", orte:[], rk:{}, sk:{}, ergebnis:"offen", begr:"", vieraugen:false};
  if(!t.nis2.orte.length && t.standort)
    t.nis2.orte = t.standort==="standortübergreifend" ? ["Leutenbach","Bischofshofen","Graz","Myjava","Międzyrzecze Górne"] : [t.standort];
  return t.nis2;
}
const nisMyjava = t => nisOrte(t).includes("Myjava");
function nisAutoErheblich(t){
  const n=nis2(t);
  return NIS2_DIRECT.some(k=>n.rk[k.id]==="ja") || n.sk.sk1==="ja";
}
function ensureNisTask(t, origin, name, rolle, hours){
  let task=t.tasks.find(x=>x.origin===origin);
  const soll=t.kenntnis+hours*3600000;
  if(!task){
    t.tasks.push({id:Math.random().toString(36).slice(2), origin, name, rolle, due:soll, done:false});
    log(t,tr("Aufgabe erzeugt:")+" "+taskLabel(name)+" ("+tr("fällig")+" "+fmt(soll)+")");
  } else if(!task.done && task.due!==soll){ task.due=soll; log(t,tr("Meldeaufgabe neu terminiert:")+" "+taskLabel(name)+" → "+fmt(soll)); }
}

function nisAfterChange(t){
  const n=nis2(t);

    ensureNisTask(t,"nis24sk",NISSK_NAME,"ISB / Standortverantwortlicher Myjava",24);

function updNisF(f,v,label){
  const t=T(); if(!t||!canEdit(t)) return;
  const n=nis2(t); if(n[f]===v) return;
  if(f==="ergebnis" && v==="nicht erheblich" && nisAutoErheblich(t) && S.role!=="isb"){
    alert(tr("Die Verneinung trotz erfüllten Relevanzkriteriums ist dem ISB vorbehalten (STD_010.002 Kap. 7.4).")); render(); return;

  const old=n[f]; n[f]=v;
  log(t,"NIS-2 · "+(label||f)+": "+tr(String(old===""||old===undefined?"—":old))+" → "+tr(String(v===""?"—":v)));

  const t=T(); if(!t||!canEdit(t)) return;

const LSKEY = "reutib-irm-v1";
let S = load();
function load(){
  let s=null;
  try{ s = JSON.parse(localStorage.getItem(LSKEY)); }catch(e){}
  if(!s || !s.tickets) s = {tickets:[], seq:1, role:"triage", roleDom:"A", tab:"portal"};
  if(!s.lang) s.lang = (navigator.language||"de").toLowerCase().startsWith("de") ? "de" : "en";
  if(!s.theme) s.theme = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  return s;
}
function save(t){
  const persist = API ? {...S, tickets: []} : S;
  localStorage.setItem(LSKEY, JSON.stringify(persist));
  if(API && t) pushTicket(t);
}

/* ---------- Serveranbindung: zentrale Datenbank, Mehrbenutzerbetrieb (V1.10) ---------- */
const APP_VERSION="1.10";
let API=null, REV=0, NET=null, SRVINFO=null;
function authTok(){ return S.token||""; }
async function api(p, opts={}, retried){
  const r = await fetch(API+p, {...opts, headers:{"Content-Type":"application/json", ...(authTok()?{Authorization:"Bearer "+authTok()}:{}), ...(opts.headers||{})}});
  if(r.status===401 && !retried){
    const tk=prompt(tr("Zugriffstoken für den IRM-Server:"));
    if(tk){ S.token=tk.trim(); save(); return api(p,opts,true); }
  }
  if(!r.ok) throw new Error("API "+r.status);
  return r.json();
}
async function pushTicket(t){
  try{ const r=await api("/api/tickets/"+encodeURIComponent(t.id),{method:"PUT",body:JSON.stringify(t)}); REV=Math.max(REV,r.rev); setNet(true); }
  catch(e){ setNet(false); }
}
async function fullLoad(){
  const r=await api("/api/tickets");
  S.tickets=r.tickets.sort((a,b)=>b.erstellt-a.erstellt); S.seq=Math.max(1, r.seq+1); REV=r.rev;
}
async function pollChanges(){
  if(!API) return;
  try{
    const r=await api("/api/changes?since="+REV);
    let changed=false;
    for(const j of r.tickets){
      const i=S.tickets.findIndex(x=>x.id===j.id);
      if(i>=0){ if(JSON.stringify(S.tickets[i])!==JSON.stringify(j)){ S.tickets[i]=j; changed=true; } }
      else { S.tickets.unshift(j); changed=true; }
    }
    REV=r.rev; if(r.seq+1>S.seq)S.seq=r.seq+1;
    setNet(true);
    const tag=document.activeElement && document.activeElement.tagName;
    if(changed && !["INPUT","TEXTAREA","SELECT"].includes(tag)) render();
  }catch(e){ setNet(false); }
}

const $ = id=>document.getElementById(id);
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const now = ()=>Date.now();
function fmt(ts){ if(!ts) return "–"; const d=new Date(ts); const loc=S.lang==="en"?"en-GB":"de-DE";
  return d.toLocaleDateString(loc)+" "+d.toLocaleTimeString(loc,{hour:"2-digit",minute:"2-digit"}); }
function fmtRest(ms){
  const neg = ms<0; ms=Math.abs(ms);
  const h=Math.floor(ms/3600000), m=Math.floor(ms%3600000/60000);
  const dayU = S.lang==="en"?" d ":" Tg ";
  const s = h>=48 ? Math.floor(h/24)+dayU+(h%24)+" h" : h+" h "+String(m).padStart(2,"0")+" min";
  return (neg?tr("überfällig seit "):"")+s;
}
function dtLocal(ts){ const d=new Date(ts); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function parseDt(v){ return v? new Date(v).getTime() : null; }
function roleLabel(){ return tr(ROLES[S.role].l) + (S.role==="dombearb" ? " – "+tr("Domäne")+" "+S.roleDom : ""); }
function log(t, txt){ t.log.unshift({ts:now(), who:(S.user? S.user+" – ":"")+roleLabel(), txt}); }

/* ---------- Severity (GDL Kap. 6.3) ---------- */
const ORD = {"P1":4,"P2":3,"P3":2,"P4":1,"nicht betroffen":0,"":0,undefined:0};
function computed(t){
  let mx = 0;
  for(const [k] of SDIM) mx = Math.max(mx, ORD[t[k]]||0);
  let stufe = mx>=4?"P1":mx===3?"P2":mx===2?"P3":mx===1?"P4":null;
  let esk = stufe==="P1"?"E2":stufe==="P2"?"E1":"E0";
  /* Regel 12: Rückrufverdacht → Zwangsstufe P1 */
  if(t.leitdomaene==="H" && t.pf.kunde_produkt==="ja"){ stufe="P1"; esk="E2"; }
  /* Regel 5: externe Meldepflicht ≤ 24 h auf „ja“ → E2 */
  const p24 = PFL.some(p=>p.tasks.some(x=>x[1]<=24) && t.pf[p.id]==="ja");
  if(p24) esk="E2";
  if(t.eskOverride==="E3") esk="E3";
  return {stufe, esk};
}
function effStufe(t){ return t.herabStufe && t.herab==="genehmigt" ? t.herabStufe : computed(t).stufe; }
function effEsk(t){ return computed(t).esk; }
const SLA_H = {P1:1,P2:4,P3:8,P4:24};

/* ---------- Sichtbarkeit / Berechtigungen ---------- */
function isProtected(t){ return t.leitdomaene && DOM[t.leitdomaene].prot; }
function canSee(t){
  switch(S.role){
    case "isb": return true;
    case "dsb": return true;
    case "gl": return !isProtected(t);
    case "auditor": return !isProtected(t);
    case "triage": return !isProtected(t);
    case "dombearb": return isProtected(t) ? t.leitdomaene===S.roleDom
                     : (!t.leitdomaene || t.leitdomaene===S.roleDom || (t.nebendomaenen||[]).includes(S.roleDom));
    case "melder": return false;
    default: return false;
  }
}
function canEdit(t){
  if(["auditor","melder","gl"].includes(S.role)) return false;
  if(S.role==="dsb") return t.pf.dsgvo==="ja" || t.leitdomaene==="J";
  return canSee(t);
}

/* ---------- Meldeaufgaben / Fristen ab Kenntniserlangung ---------- */
function syncTasks(t){
  for(const p of PFL){
    const active = t.pf[p.id]==="ja";
    for(const [name,h] of p.tasks){
      let task = t.tasks.find(x=>x.origin===p.id && x.name===name);
      if(active && !task){
        t.tasks.push({id:Math.random().toString(36).slice(2), origin:p.id, name, rolle:p.rolle, due:t.kenntnis+h*3600000, done:false});
        log(t, tr("Meldeaufgabe erzeugt:")+" "+taskLabel(name)+" ("+tr("fällig")+" "+fmt(t.kenntnis+h*3600000)+", "+tr("Frist ab Kenntniserlangung")+")");
      } else if(active && task && !task.done){
        const soll = t.kenntnis+h*3600000;
        if(task.due!==soll){ task.due=soll; log(t,tr("Meldeaufgabe neu terminiert:")+" "+taskLabel(name)+" → "+fmt(soll)); }
      } else if(!active && task && !task.done){
        t.tasks = t.tasks.filter(x=>x!==task);
        log(t,tr("Meldeaufgabe entfernt (Meldepflicht nicht mehr aktiv):")+" "+taskLabel(name));
      }
    }
    if(active && p.appr && !t.approvals.find(a=>a.key===p.id)){
      t.approvals.push({key:p.id, l:"Freigabe: "+p.l, by:p.appr, state:"offen"});
      log(t,tr("Genehmigungsschritt angelegt:")+" "+tr(p.l)+" ("+tr(p.appr)+")");
    }
    if(active && p.dsb && !t.beobachter.includes("Datenschutzbeauftragter")){
      t.beobachter.push("Datenschutzbeauftragter");
      log(t,tr("Datenschutzbeauftragter als Beobachter gesetzt (Art. 33/34)."));
    }
  }
  for(const [org,h] of [["nis18",18],["nis24sk",24]]){
    const task=t.tasks.find(x=>x.origin===org);
    if(task && !task.done){ const soll=t.kenntnis+h*3600000;
      if(task.due!==soll){ task.due=soll; log(t,tr("Meldeaufgabe neu terminiert:")+" "+taskLabel(task.name)+" → "+fmt(soll)); } }
  }
}

/* Vorrangregel Personengefährdung (Regel 6 / Testfall 16) */
function vorrang(t){
  if(["P1","P2"].includes(t.s1) && t.leitdomaene && t.leitdomaene!=="E"){
    const alt = t.leitdomaene;
    if(!t.nebendomaenen.includes(alt)) t.nebendomaenen.push(alt);
    t.leitdomaene = "E";
    t.owner = ownerFor(t);
    t.approvals.push({key:"vorrang"+now(), l:"Bestätigung Vorrangregel Personengefährdung (Leitdomäne → E, vormals "+alt+")", by:"ISB", state:"offen"});
    log(t,tr("VORRANGREGEL: S1")+"="+t.s1+" → "+tr("Leitdomäne wechselt selbsttätig auf E; bisherige Domäne wird Nebendomäne. Bestätigungsaufgabe an den ISB.")+" ["+alt+"]");
  }
}
function ownerFor(t){
  if(!t.leitdomaene) return "";
  const d = DOM[t.leitdomaene];
  return "Incident Owner "+t.leitdomaene+(d.site && t.standort && t.standort!=="standortübergreifend" ? " · "+t.standort : "");
}

/* ---------- Statusübergänge (GDL Kap. 7) ---------- */
function allowedNext(t){
  const st = effStufe(t);
  switch(t.status){
    case "Open": return ["Triage"];
    case "Triage": return st==="P4" ? ["In Bearbeitung – Eindämmung","Resolved"] : ["In Bearbeitung – Eindämmung"];
    case "In Bearbeitung – Eindämmung": return ["In Bearbeitung – Analyse","Ausgesetzt – BCM"];
    case "In Bearbeitung – Analyse": return ["In Bearbeitung – Behebung","Ausgesetzt – BCM"];
    case "In Bearbeitung – Behebung": return ["Verifikation und Freigabe","Ausgesetzt – BCM"];
    case "Verifikation und Freigabe": return ["Resolved"];
    case "Resolved": return ["Closed"];
    case "Ausgesetzt – BCM": return ["In Bearbeitung – Eindämmung","In Bearbeitung – Analyse","In Bearbeitung – Behebung"];
    case "Closed": return S.role==="isb" ? ["Triage"] : [];
  }
  return [];
}
function checkTransition(t, to){
  const miss = [];
  const st = effStufe(t);
  const p12 = ["P1","P2"].includes(st);
  const M = (de,en)=>miss.push(S.lang==="en"?en:de);
  if(t.status==="Open" && to==="Triage"){
    if(!t.kenntnis) M("Kenntniserlangung","Time of awareness");
    if(!t.standort) M("Standort","Site");
  }
  if(t.status==="Triage" && to!=="Triage"){
    if(!t.leitdomaene) M("Leitdomäne","Lead domain");
    if(!t.owner) M("Incident Owner","Incident owner");
    for(const [k,l] of SDIM) if(!t[k]) miss.push(tr(l));
    for(const p of PFL){ if(p.opt) continue;
      if(p.app(t) && (!t.pf[p.id] || t.pf[p.id]==="nicht geprüft"))
        M("Meldepflicht „"+p.l+"“ (steht auf „nicht geprüft“)","Reporting duty “"+tr(p.l)+"” (still “not assessed”)");
    }
    if(needBegruendungAbw(t) && !t.kenntnisBegr) M("Begründung der Abweichung Kenntniserlangung/Erstellung (> 1 h)","Justification of the gap between awareness and creation (> 1 h)");
    const nx=t.nis2||{};
    if(!nx.sysbezug || nx.sysbezug==="nicht geprüft") M("NIS-2-Relevanzbewertung: Systembezug (steht auf „nicht geprüft“)","NIS-2 relevance: system involvement (still “not assessed”)");
    if(nx.sysbezug==="nein" && !nx.sysbegr) M("NIS-2-Relevanzbewertung: Begründung fehlender Systembezug","NIS-2 relevance: justification of missing system involvement");
    if(nx.sysbezug==="ja"){
      for(const k of NIS2_DIRECT) if(!nx.rk || !nx.rk[k.id]) M("NIS-2-Prüfbogen Teil 2: "+k.id.toUpperCase().replace("RK","RK-")+" unbeantwortet","NIS-2 form part 2: "+k.id.toUpperCase().replace("RK","RK-")+" unanswered");
    }
  }
  if(t.status==="In Bearbeitung – Eindämmung" && to==="In Bearbeitung – Analyse"){
    if(!t.sofort) M("Sofortmaßnahmen (Protokoll)","Immediate actions (log)");
    if(p12 && !t.beweis) M("Beweissicherung erfolgt (Pflicht bei P1/P2)","Evidence secured (mandatory for P1/P2)");
  }
  if(t.status==="In Bearbeitung – Analyse" && to==="In Bearbeitung – Behebung"){
    if(!t.gef || t.gef==="noch nicht bestimmt") M("Gefährdungsbezug (steht auf „noch nicht bestimmt“)","Threat reference (still “not yet determined”)");
    if(p12 && !t.ursache1) M("Unmittelbare Ursache (Pflicht bei P1/P2)","Immediate cause (mandatory for P1/P2)");
    if(p12 && !t.ursache2) M("Systemursache (Pflicht bei P1/P2)","Root cause (mandatory for P1/P2)");
  }
  if(t.status==="Verifikation und Freigabe" && to==="Resolved"){
    if(!t.freigabe) M("Freigabe der Wiederaufnahme","Release for resumption");
    if(p12 && !t.freigabeIsb) M("Bestätigung des ISB (Pflicht bei P1/P2)","ISB confirmation (mandatory for P1/P2)");
    if(t.pf.kunde_produkt==="ja" && !t.freigabeQl) M("Bestätigung der Qualitätsleitung (Produktbezug)","Quality management confirmation (product-related)");
  }
  if(to==="Closed"){
    if(p12){
      if(!t.abschlussbericht && !hasAtt(t,"abschluss")) M("Abschlussbericht (Anlage, ISMS-TMPL-006a)","Final report (attachment, ISMS-TMPL-006a)");
      if(!t.lessons) M("Lessons Learned","Lessons learned");
      if(!t.risikoRef) M("Referenz Risikoregister","Risk register reference");
    }
    if(["F","G","H"].includes(t.leitdomaene)){
      if(!t.fvAbgeschlossen) M("Fachvorgang abgeschlossen (Domäne "+t.leitdomaene+")","Business record completed (domain "+t.leitdomaene+")");
      if(!t.fvNummer) M("Führender Fachvorgang – Nummer","Leading business record – number");
    }
    if(t.gef==="noch nicht bestimmt"||!t.gef) M("Gefährdungsbezug","Threat reference");
    const nc=t.nis2||{};
    if(nc.sysbezug==="ja"){
      for(const k of NIS2_CHECK) if(!nc.rk || !nc.rk[k.id]) M("NIS-2-Prüfbogen Teil 3: "+k.id.toUpperCase().replace("RK","RK-")+" unbeantwortet","NIS-2 form part 3: "+k.id.toUpperCase().replace("RK","RK-")+" unanswered");
      if(nisMyjava(t)) for(const k of NIS2_SK) if(!nc.sk || !nc.sk[k.id]) M("NIS-2-Prüfbogen Teil 4 (Slowakei): Frage unbeantwortet","NIS-2 form part 4 (Slovakia): question unanswered");
      if(!nc.ergebnis || nc.ergebnis==="offen") M("NIS-2-Relevanzbewertung: Gesamtergebnis","NIS-2 relevance: overall result");
      if(nc.ergebnis && nc.ergebnis!=="offen" && !nc.begr) M("NIS-2-Relevanzbewertung: Tragende Begründung","NIS-2 relevance: supporting justification");
      if(nc.ergebnis==="nicht erheblich" && p12 && !nc.vieraugen) M("NIS-2-Verneinung bei P1/P2: Vier-Augen-Bestätigung des Incident Owners","NIS-2 negation for P1/P2: four-eyes confirmation of the incident owner");
    }
  }
  if(to==="Ausgesetzt – BCM"){
    if(!t.bcmNote) M("Übergabeprotokoll BCM (Notiz)","BCM hand-over record (note)");
  }
  return miss;
}
function needBegruendungAbw(t){ return t.kenntnis && t.erstellt && (t.erstellt - t.kenntnis) > 3600000; }

/* Nachbereitung (Regeln 17/18) */
function afterTransition(t, to){
  const st = effStufe(t);
  if(to==="Resolved" && ["P1","P2"].includes(st)){
    addOnce(t,"nb1","Post-Incident-Review durchführen","Incident Owner",14*24);
    addOnce(t,"nb2","Abschlussbericht und Risikobewertung erstellen","Incident Owner / ISB",30*24);
  }
  if(to==="Closed" && ["P1","P2"].includes(st)){
    addOnce(t,"nb3","Wirksamkeitsprüfung der Maßnahmen","ISB",183*24);
    t.wirksamkeit = now()+183*24*3600000;
  }
}
function addOnce(t, key, name, rolle, hours){
  if(!t.tasks.find(x=>x.origin===key)){
    t.tasks.push({id:Math.random().toString(36).slice(2), origin:key, name, rolle, due:now()+hours*3600000, done:false});
    log(t,tr("Aufgabe erzeugt:")+" "+taskLabel(name)+" ("+tr("fällig")+" "+fmt(now()+hours*3600000)+")");
  }
}

/* ---------- Export / Import ---------- */
function exportJson(){
  const blob = new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="REUTIB_IRM_Stand_"+new Date().toISOString().slice(0,10)+".json"; a.click();
}
function importJson(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async ()=>{ try{ const s=JSON.parse(r.result); if(!s.tickets) throw 0;
    if(API){ for(const t of s.tickets){ await pushTicket(t); } await fullLoad(); }
    else { S=s; }
    save(); render(); }catch(e){ alert(tr("Datei konnte nicht gelesen werden.")); } };
  r.readAsText(f);
}
function exportCsv(list){
  const cols=S.lang==="en"
    ?["ID","Subject","Status","Lead domain","Site","Overall level","Escalation","Time of awareness","Created","Incident owner","Threat","TISAX","Open tasks"]
    :["ID","Betreff","Status","Leitdomäne","Standort","Gesamtstufe","Eskalation","Kenntniserlangung","Erstellt","Incident Owner","Gefährdung","TISAX","Offene Aufgaben"];
  const rows=list.map(t=>[t.id,t.betreff,tr(t.status),t.leitdomaene,siteLabel(t.standort),effStufe(t)||"",effEsk(t),fmt(t.kenntnis),fmt(t.erstellt),t.owner,gefLabel(t.gef),t.tisax?tr("ja"):tr("nein"),t.tasks.filter(x=>!x.done).length]);
  const csv=[cols,...rows].map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";")).join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"})); a.download="REUTIB_IRM_Tickets.csv"; a.click();
}

async function submitMeldung(nearmiss){
  const betreff=$("f_betreff").value.trim(), beschr=$("f_beschr").value.trim(), standort=$("f_standort").value;
  const miss=[]; if(!betreff)miss.push(tr("Betreff")); if(!beschr)miss.push(tr("Beschreibung")); if(!standort)miss.push(tr("Standort"));
  if(miss.length){ alert(tr("Bitte ausfüllen: ")+miss.join(", ")); return; }
  const atts=[];
  const fi=$("f_att");
  if(fi&&fi.files.length){
    for(const f of fi.files){
      if(f.size>2*1048576){ alert(tr("Datei zu groß (max. 2 MB):")+" "+f.name); continue; }
      atts.push(await readFileAsAtt(f,"meldung"));
    }
  }
  const t=await newTicket({betreff, beschreibung:beschr, standort, beobachtet:parseDt($("f_beob").value), personen:$("f_pers").checked, quelle:$("f_quelle").value, nearmiss, kanal:"Portal", anhaenge:atts});
  if(atts.length){ log(t,tr("Anlage hinzugefügt:")+" "+atts.map(a=>a.name).join(", ")); save(t); }
  const de = S.lang!=="en";
  $("formBox").innerHTML=`<div class="note oklight"><b>${de?"Vielen Dank – Ihre Meldung wurde aufgenommen":"Thank you – your report has been recorded"} (${t.id}).</b><br>
  ${de?"Die Triage übernimmt jetzt die Einordnung.":"The triage team will now classify it."} ${nearmiss?(de?"Die Arbeitssicherheit wurde informiert.":"Occupational safety has been informed."):""} ${de?"Bei Rückfragen meldet sich das IRM-Team.":"The IRM team will contact you if anything is unclear."}</div>`;
}

function T(){ return S.tickets.find(x=>x.id===S.detail); }
function upd(field, value, label){
  const t=T(); if(!t||!canEdit(t)) return;
  const old=t[field];
  if(old===value) return;
  t[field]=value;
  const f=v=>field==="kenntnis"?fmt(v):String(v===undefined||v===""?"—":v);
  log(t, (label||field)+": "+f(old)+" → "+f(value));
  if(field==="kenntnis"){ syncTasks(t); }
  if(["s1","s2","s3","s4","s5","s6"].includes(field)){ vorrang(t); }
  if(field==="leitdomaene"){
    t.owner=ownerFor(t);
    if(isProtected(t)) log(t,tr("Ticket in den geschützten Arbeitsbereich verschoben. Triage-Rollen haben ab jetzt keinen Lesezugriff mehr.")+" ["+t[field]+"]");
  }
  save(t); render();
}
function updPf(id, value){
  const t=T(); if(!t||!canEdit(t)) return;
  const p=PFL.find(x=>x.id===id);
  const old=t.pf[id]; if(old===value) return;
  t.pf[id]=value;
  log(t,tr("Meldepflicht")+" "+tr(p.l)+": "+tr(old)+" → "+tr(value));
  syncTasks(t);
  save(t); render();
}
function setStatus(to){
  const t=T(); if(!t) return;
  if(t.status==="Closed" && S.role!=="isb"){ alert(tr("Wiedereröffnung nur durch den ISB.")); return; }
  const miss=checkTransition(t,to);
  if(miss.length){
    const de=S.lang!=="en";
    $("dlgBody").innerHTML=`<h2 style="margin-top:0">${tr("Statuswechsel nicht möglich")}</h2>
    <div class="err">${de?`Der Wechsel nach „${tr(to)}“ ist blockiert. Folgende Pflichtangaben fehlen:`:`The transition to “${tr(to)}” is blocked. The following mandatory entries are missing:`}</div>
    <ul>${miss.map(m=>`<li><b>${esc(m)}</b></li>`).join("")}</ul>
    <p class="small muted">${de?"Blockierende Pflichten werden nicht durch Erinnerungen ersetzt (GDL Kap. 10.1, Anhang B).":"Blocking obligations are never replaced by reminders (GDL ch. 10.1, Annex B)."}</p>`;
    $("dlg").showModal(); return;
  }
  const from=t.status; t.status=to;
  if(!t.erstreaktion && from==="Open"){ t.erstreaktion=now(); log(t,tr("Erstreaktion dokumentiert (Übernahme durch die Triage).")); }
  log(t,tr("Statuswechsel:")+" "+tr(from)+" → "+tr(to));
  afterTransition(t,to);
  save(t); render();
}
function taskDone(tid){
  const t=T(); const task=t.tasks.find(x=>x.id===tid); if(!task) return;
  task.done=!task.done; task.doneTs=task.done?now():null;
  log(t,(task.done?tr("Aufgabe erledigt:"):tr("Aufgabe wieder geöffnet:"))+" "+taskLabel(task.name));

}
function approve(idx, state){
  const t=T(); const a=t.approvals[idx]; if(!a) return;
  const need = a.by==="ISB"?"isb":"gl";
  if(S.role!==need){ alert(tr("Genehmigung nur durch: ")+tr(a.by)); return; }
  a.state=state; a.ts=now(); a.who=roleLabel();
  log(t,tr("Genehmigung")+" "+a.l+": "+tr(state)+" ("+tr(a.by)+")");

function requestHerab(){
  const t=T();

  if(!ziel||!["P2","P3","P4"].includes(ziel.toUpperCase())) return;
  const begr=prompt(tr("Begründung der Herabstufung (Pflicht):"),""); if(!begr) return;
  t.herab="beantragt"; t.herabStufe=ziel.toUpperCase(); t.herabBegr=begr;
  t.einstufungBegr=(t.einstufungBegr?t.einstufungBegr+"\n":"")+fmt(now())+" "+tr("Herabstufung beantragt")+" → "+ziel.toUpperCase()+": "+begr;

function toggleNeben(d, on){
  const t=T(); if(!t||!canEdit(t)) return;
  t.nebendomaenen = on ? [...new Set([...(t.nebendomaenen||[]),d])] : (t.nebendomaenen||[]).filter(x=>x!==d);
  if(on){
    log(t,tr("Nebendomäne gesetzt → Mitwirkungsaufgabe an den Incident Owner, Beobachterstatus (Regel 7).")+" ["+d+"]");
    addOnce(t,"neben_"+d,"Mitwirkung Nebendomäne "+d+" – "+DOM[d].n,"Incident Owner "+d,72);
    if(!t.beobachter.includes("Incident Owner "+d)) t.beobachter.push("Incident Owner "+d);
  } else log(t,tr("Nebendomäne entfernt.")+" ["+d+"]");
  save(t); render();
}

/* ---------- Fristenmonitor ---------- */
function viewFristen(){
  const de = S.lang!=="en";
  const rows=[];
  for(const t of S.tickets.filter(canSee)){
    const st=effStufe(t);
    if(t.erstreaktion===null && st && !["Resolved","Closed"].includes(t.status)){
      const due=t.kenntnis+SLA_H[st]*3600000;
      rows.push({t, name:tr("Erstreaktion")+" ("+st+", "+SLA_H[st]+" h)", rolle:t.owner||"Triage", due, typ:"SLA"});
    }
    for(const x of t.tasks) if(!x.done && t.status!=="Closed") rows.push({t, name:taskLabel(x.name), rolle:tr(x.rolle), due:x.due, typ:x.origin.startsWith("nb")||x.origin.startsWith("neben")?tr("Aufgabe"):tr("Meldepflicht")});
  }
  rows.sort((a,b)=>a.due-b.due);
  const od=rows.filter(r=>r.due<now());
  return `<h1>${tr("Fristenmonitor")}</h1>
  <p class="muted">${de
   ?"Alle offenen Melde- und SLA-Fristen mit Restlaufzeit (Ampel: &gt;50 % grün · 50–75 % gelb · &gt;75 % orange · überschritten rot). Eskalationskette gem. GDL Kap. 9.2/11: 50 % → Incident Owner, 75 % → zusätzlich ISB, Überschreitung → zusätzlich Geschäftsleitung."
   :"All open notification and SLA deadlines with time remaining (traffic light: &gt;50 % green · 50–75 % yellow · &gt;75 % orange · breached red). Escalation chain per GDL ch. 9.2/11: 50 % → incident owner, 75 % → additionally ISB, breach → additionally executive management."}</p>
  <div class="kpis"><div class="kpi"><div class="v">${rows.length}</div><div class="l">${tr("offene Fristen")}</div></div>
  <div class="kpi"><div class="v" style="color:${od.length?"var(--crit)":"inherit"}">${od.length}</div><div class="l">${tr("überfällig (Fristverletzung → Monatsbericht)")}</div></div></div>
  ${rows.length?`<table><thead><tr><th></th><th>${tr("Ticket")}</th><th>${tr("Frist / Aufgabe")}</th><th>${tr("Typ")}</th><th>${tr("Zuständig")}</th><th>${tr("Fällig")}</th><th>${tr("Restlaufzeit")}</th></tr></thead><tbody>
  ${rows.map(r=>{
    const total = r.due-(r.t.kenntnis||r.due); const gone = now()-(r.t.kenntnis||now());
    const q = total>0? gone/total : 1;
    const amp = r.due<now()?"r":q>0.75?"o":q>0.5?"y":"g";
    return `<tr class="click" onclick="openT('${r.t.id}')"><td><span class="amp ${amp}"></span></td>
    <td><b>${r.t.id}</b> <span class="small muted">${esc(r.t.betreff.slice(0,40))}</span></td>
    <td>${esc(r.name)}</td><td class="small">${r.typ}</td><td class="small">${esc(r.rolle)}</td>
    <td class="small">${fmt(r.due)}</td><td>${r.due<now()?`<b style="color:var(--crit)">${fmtRest(r.due-now())}</b>`:fmtRest(r.due-now())}</td></tr>`;
  }).join("")}</tbody></table>`:`<div class="note">${tr("Keine offenen Fristen im sichtbaren Bereich.")}</div>`}`;
}

/* ---------- Berichte (GDL Kap. 12) ---------- */
function viewBerichte(){
  const de = S.lang!=="en";
  const all=S.tickets;
  const prot=all.filter(isProtected);
  const open=all.filter(t=>!["Resolved","Closed"].includes(t.status));
  const p12=open.filter(t=>["P1","P2"].includes(effStufe(t)));
  const odTasks=all.flatMap(t=>t.tasks.filter(x=>!x.done&&x.due<now()));
  const klassOk=all.filter(t=>SDIM.every(([k])=>t[k]) && !PFL.some(p=>p.app(t)&&!p.opt&&t.pf[p.id]==="nicht geprüft"));
  const nm=all.filter(t=>t.nearmiss);
  const matrix={};
  for(const d of DOMKEYS) matrix[d]={P1:0,P2:0,P3:0,P4:0,offen:0,gesamt:0};
  for(const t of all){ if(!t.leitdomaene) continue; const m=matrix[t.leitdomaene]; m.gesamt++;
    const s=effStufe(t); if(s)m[s]++; if(!["Resolved","Closed"].includes(t.status))m.offen++; }
  const gefCount={};
  for(const t of all){ if(t.gef && t.gef!=="noch nicht bestimmt"){ gefCount[t.gef]=(gefCount[t.gef]||0)+1; } }
  const topGef=Object.entries(gefCount).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const h=all.filter(t=>t.leitdomaene==="H"); const withFv=h.filter(t=>t.fvNummer);
  return `<h1>${de?"Auswertung und Berichte":"Evaluation and reports"}</h1>
  <p class="muted">${de
   ?"Kennzahlen nach Kap. 12 der Prozessbeschreibung. Der geschützte Bereich (Domänen E und I) fließt ausschließlich <b>aggregiert und ohne Personenbezug</b> ein; eine Auswertung nach Bearbeitern oder meldenden Personen ist nicht möglich und wird nicht angeboten (GDL Kap. 4/12)."
   :"KPIs per ch. 12 of the process description. The protected workspace (domains E and I) is included <b>in aggregate form only, without any personal reference</b>; evaluation by agents or reporting persons is not possible and not offered (GDL ch. 4/12)."}</p>
  <h2>${de?"Lagebild":"Situation picture"}</h2>
  <div class="kpis">
   <div class="kpi"><div class="v">${all.length}</div><div class="l">${de?"Incidents gesamt":"Incidents total"}</div></div>
   <div class="kpi"><div class="v">${open.length}</div><div class="l">${tr("offen")}</div></div>
   <div class="kpi"><div class="v" style="color:${p12.length?"var(--crit)":"inherit"}">${p12.length}</div><div class="l">${de?"offen P1/P2":"open P1/P2"}</div></div>
   <div class="kpi"><div class="v" style="color:${odTasks.length?"var(--crit)":"inherit"}">${odTasks.length}</div><div class="l">${de?"Meldeaufgaben überfällig":"notification tasks overdue"}</div></div>
   <div class="kpi"><div class="v">${all.length?Math.round(100*klassOk.length/all.length):0}%</div><div class="l">${de?"Klassifizierungsqualität (vollständig, ohne „nicht geprüft“)":"classification quality (complete, none “not assessed”)"}</div></div>
   <div class="kpi"><div class="v">${nm.length}</div><div class="l">${de?"Beinaheereignisse (Meldequote-KPI)":"near misses (reporting-rate KPI)"}</div></div>
   <div class="kpi"><div class="v">${prot.length}</div><div class="l">${de?"geschützter Bereich (nur aggregiert)":"protected workspace (aggregate only)"}</div></div>
  </div>
  ${(()=>{
    const sev={P1:0,P2:0,P3:0,P4:0};
    for(const t of open){ const sx=effStufe(t); if(sx)sev[sx]++; }
    const sevTot=sev.P1+sev.P2+sev.P3+sev.P4;
    const stC=STATUS.map(st=>[st, all.filter(t=>t.status===st).length]);
    const maxSt=Math.max(1,...stC.map(x=>x[1]));
    const W=7*24*3600000, wk=new Array(8).fill(0);
    for(const t of all){ const dwk=Math.floor((now()-t.erstellt)/W); if(dwk>=0&&dwk<8) wk[7-dwk]++; }
    const maxWk=Math.max(1,...wk);
    let aok=0,awarn=0,acrit=0,aover=0;
    for(const t of all){ if(t.status==="Closed") continue;
      for(const x of t.tasks){ if(x.done) continue;
        if(x.due<now()){aover++;continue;}
        const tot=x.due-(t.kenntnis||x.due), gone=now()-(t.kenntnis||now());
        const q= tot>0? gone/tot:1;
        if(q>0.75)acrit++; else if(q>0.5)awarn++; else aok++;
      } }
    return `<h2>Dashboard <span class="small muted">– ${de?"Statusreport für das Board (druckbar über die Browser-Druckfunktion)":"status report for the board (printable via the browser print function)"}</span></h2>
    <div class="grid2">
     <div class="card"><h3>${de?"Offene Incidents nach Gesamtstufe":"Open incidents by overall level"}</h3>
      ${sevTot?`<div style="display:flex;height:36px;border-radius:6px;overflow:hidden;border:1px solid var(--line)">${["P1","P2","P3","P4"].map(x=>sev[x]?`<div class="${x.toLowerCase()} tip" data-tip="${esc(pLabel(x))}: ${sev[x]}" style="width:${Math.round(100*sev[x]/sevTot)}%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;min-width:28px">${sev[x]}</div>`:"").join("")}</div>
      <div class="flex small" style="margin-top:7px">${["P1","P2","P3","P4"].map(x=>`<span class="badge ${x.toLowerCase()} tip" data-tip="${esc(pLabel(x))}">${x}</span><span class="muted">${tr(PDESC[x])}</span>`).join("&nbsp; ")}</div>`
      :`<p class="muted small">${de?"Keine offenen Incidents.":"No open incidents."}</p>`}
     </div>
     <div class="card"><h3>${de?"Fristenampel — offene Melde- und Folgeaufgaben":"Deadline traffic light — open tasks"}</h3>
      <div class="kpis" style="margin:4px 0;grid-template-columns:repeat(4,1fr)">
       <div class="kpi"><div class="v" style="color:var(--ok)">${aok}</div><div class="l">${de?"im Plan":"on track"}</div></div>
       <div class="kpi"><div class="v" style="color:#b29200">${awarn}</div><div class="l">&gt; 50 %</div></div>
       <div class="kpi"><div class="v" style="color:var(--warn)">${acrit}</div><div class="l">&gt; 75 %</div></div>
       <div class="kpi"><div class="v" style="color:var(--crit)">${aover}</div><div class="l">${tr("überfällig")}</div></div>
      </div>
     </div>
     <div class="card"><h3>${de?"Status-Pipeline (alle Tickets)":"Status pipeline (all tickets)"}</h3>
      ${stC.map(([stx,c])=>`<div style="display:flex;align-items:center;gap:8px;margin:3px 0"><span class="small" style="width:200px;flex:none">${tr(stx)}</span><div style="background:var(--gelb);height:14px;border-radius:3px;width:${Math.round(62*c/maxSt)}%;min-width:${c?8:0}px"></div><b class="small">${c||"·"}</b></div>`).join("")}
     </div>
     <div class="card"><h3>${de?"Meldeaufkommen — letzte 8 Wochen":"Report volume — last 8 weeks"}</h3>
      <div style="display:flex;align-items:flex-end;gap:6px;height:96px;padding-top:8px">${wk.map((c,i)=>`<div style="flex:1;text-align:center"><div class="small" style="font-weight:700">${c||""}</div><div style="background:${i===7?"var(--gelb)":"var(--grau)"};height:${Math.round(68*c/maxWk)}px;border-radius:3px 3px 0 0;min-height:${c?4:1}px"></div></div>`).join("")}</div>
      <div class="small muted" style="display:flex;justify-content:space-between"><span>${de?"vor 8 Wochen":"8 weeks ago"}</span><span>${de?"diese Woche":"this week"}</span></div>
     </div>
    </div>`;
  })()}
  <h2>${de?"Lagebild Domänen":"Domain overview"} <span class="small muted">– ${de?"offene/gesamt je Domäne und Verteilung der Gesamtstufen":"open/total per domain and distribution of overall levels"}</span></h2>
  <table class="matrix"><thead><tr><th>${tr("Domäne")}</th><th>${de?"Bezeichnung":"Name"}</th>${["P1","P2","P3","P4"].map(x=>`<th class="tip" data-tip="${esc(pLabel(x))}">${x}</th>`).join("")}<th>${tr("offen")}</th><th>${de?"gesamt":"total"}</th></tr></thead><tbody>
  ${DOMKEYS.map(d=>{const m=matrix[d];return `<tr><td><b>${d}</b>${DOM[d].prot?" 🔒":""}</td><td>${domName(d)}${DOM[d].prot?' <span class="small muted">'+(de?"(aggregiert)":"(aggregate)")+'</span>':""}</td>
   ${["P1","P2","P3","P4"].map(s=>`<td class="${m[s]?"":"n0"}">${m[s]||"·"}</td>`).join("")}
   <td class="${m.offen?"":"n0"}">${m.offen||"·"}</td><td class="${m.gesamt?"":"n0"}">${m.gesamt||"·"}</td></tr>`;}).join("")}
  </tbody></table>
  <h2>${de?"Gefährdungstrend":"Threat trend"} <span class="small muted">– ${de?"Häufung gleicher Gefährdungen (Eingang in die Notfallplanprüfung)":"clustering of identical threats (input to contingency plan review)"}</span></h2>
  ${topGef.length?`<table><thead><tr><th>${de?"Gefährdung":"Threat"}</th><th>${de?"Anzahl":"Count"}</th><th></th></tr></thead><tbody>
   ${topGef.map(([g,c])=>`<tr><td>${esc(gefLabel(g))}</td><td>${c}</td><td><div style="background:var(--gelb);height:12px;width:${Math.min(100,c*12)}%;min-width:12px;border-radius:3px"></div></td></tr>`).join("")}</tbody></table>`
   :`<p class="muted small">${de?"Noch keine Gefährdungszuordnungen.":"No threat assignments yet."}</p>`}
  <h2>${de?"Verknüpfungsquote Domäne H":"Linkage rate domain H"}</h2>
  <p>${h.length?(de?`${withFv.length} von ${h.length} Tickets der Domäne H mit Fachvorgangsnummer (${Math.round(100*withFv.length/h.length)} %).`:`${withFv.length} of ${h.length} domain-H tickets carry a business record number (${Math.round(100*withFv.length/h.length)} %).`):(de?"Keine Tickets der Domäne H.":"No domain-H tickets.")}</p>
  <div class="note">${de
   ?"Berichtskatalog der GDL (Kap. 12): Lagebild Domänen (monatlich GL) · Fristenmonitor (laufend ISB) · Klassifizierungsqualität (monatlich) · Reaktionszeiten (monatlich) · Erkennung/Reaktion/Eindämmung A+B · Meldequote Near Miss (quartalsweise) · Gefährdungstrend (quartalsweise) · Verknüpfungsquote H · Jahresauswertung. Der Prototyp zeigt die wichtigsten davon live; Druck über die Browser-Druckfunktion."
   :"Report catalogue of the GDL (ch. 12): domain overview (monthly, management) · deadline monitor (continuous, ISB) · classification quality (monthly) · response times (monthly) · detection/response/containment A+B · near-miss reporting rate (quarterly) · threat trend (quarterly) · linkage rate H · annual evaluation. The prototype shows the most important ones live; print via the browser print function."}</div>`;
}

/* ---------- IRM-Guidance (PROC_010.001 V2.10, nutzerorientierte Kurzfassung) ---------- */
function viewGuidance(){
  if(S.lang==="en") return `<h1>IRM Guidance – Incident Response in practice</h1>
  <p class="muted">Condensed, user-oriented summary of the process description <b>PROC_010.001 V2.10</b> (Incident Response Process &amp; Management in Freshservice, 2026-08-01), which implements policy POL_010.001 V3.00. This page guides the daily use of the IRM tool. <b>In case of doubt, the full documents are binding</b> — this summary does not replace them.</p>

  <h2>Quick start by role</h2>
  <div class="cards">
   <div class="card"><h3>👤 I am an employee (reporter)</h3>
    <p>See something unusual? <b>Report it — always.</b> Use “Report an incident” in the portal (or the near-miss entry). You do <b>not</b> classify or prioritise anything; a short description, location and time are enough. A report made in good faith never leads to any disadvantage. <b>People in acute danger? Emergency chain first (112 / plant security), report afterwards.</b></p></div>
   <div class="card"><h3>🔎 I am triage (IT helpdesk / site responsible)</h3>
    <p>Take over new tickets, verify and correct the <b>time of awareness</b> (all statutory deadlines run from it!), propose the lead domain, assess the six damage dimensions S1–S6 and complete the reporting-duty check. Phone or verbal reports must be recorded without delay, at the latest by the end of the shift.</p></div>
   <div class="card"><h3>🛠️ I am an incident owner (domain)</h3>
    <p>You drive the substantive handling: log every immediate action with timestamp and acting person, secure evidence <b>before</b> restoration (P1/P2), determine immediate and root cause, release resumption and provide lessons learned and the effectiveness review.</p></div>
   <div class="card"><h3>🛡️ ISB / management / DPO</h3>
    <p>The ISO (ISB) confirms classification, decides on reporting duties and escalation, approves downgrades (four-eyes) and monitors the deadline monitor. Management approves customer/public communication, field actions and BCM hand-over. The DPO handles Art. 33/34 GDPR and joins automatically when data-protection relevance is set.</p></div>
  </div>

  <details open><summary>1 · Purpose, scope and principles (PROC ch. 1)</summary><div class="dbody">
   <p>One single reporting point for <b>all</b> incidents — IT and cyber attacks as much as occupational accidents, fire, machine breakdowns, supply-chain disruptions, quality deviations or compliance matters. Scope: Leutenbach (DE), Bischofshofen (AT), Graz (AT), Myjava (SK), Międzyrzecze Górne (PL), plus Mexico and India under extended governance.</p>
   <ul>
    <li>Every incident is classified in <b>four dimensions</b>: D1 domain, D2 threat reference, D3 severity, D4 reporting-duty relevance.</li>
    <li>The severity is <b>calculated</b> from six damage dimensions (maximum-value principle) — never chosen freely.</li>
    <li>All external deadlines run from the <b>time of awareness</b>, not from ticket creation.</li>
    <li>The entire life cycle is recorded audit-proof in the ticket; tickets are never deleted.</li>
   </ul>
  </div></details>

  <details><summary>2 · Reporting channels — all equally valid (PROC ch. 6.1.1)</summary><div class="dbody">
   <table><thead><tr><th>Channel</th><th>Recorded by</th><th>Rule</th></tr></thead><tbody>
   <tr><td>Service portal / incident e-mail address</td><td>System</td><td>ticket is created immediately</td></tr>
   <tr><td>Phone/verbal report to supervisor or shift lead</td><td>Supervisor / shift lead</td><td>record without delay, at the latest by end of shift; name the reporter as source</td></tr>
   <tr><td>Report to the site responsible</td><td>Site responsible</td><td>without delay; outside business hours via site on-call duty</td></tr>
   <tr><td>Direct report to the ISO (on-call number)</td><td>ISO / deputy</td><td>also valid when the ticket system is down</td></tr>
   <tr><td>Emergency chain</td><td>Site responsible, after the hazard ends</td><td>hazard mitigation first; record afterwards with the <b>real</b> time of awareness</td></tr>
   <tr><td>Quality system (CAQ QBD.net)</td><td>Quality management</td><td>additional incident report for P1–P3 deviations</td></tr>
   <tr><td>Whistleblower system</td><td>Compliance officer</td><td>no automatic transfer; anonymised ticket where security-relevant</td></tr>
   </tbody></table>
   <p class="small muted">If the ticket system is unavailable: report by phone to the ISO or site responsible; subsequent recording within 24 hours (paper form at the sites).</p>
  </div></details>

  <details><summary>3 · Classification: domains, S1–S6, overall level (PROC ch. 6.2–6.4, 7)</summary><div class="dbody">
   <p><b>D1 — Lead domain</b> (controls group, workspace and duties):</p>
   <table><tbody>${DOMKEYS.map(d=>`<tr><td><b>${d}</b>${DOM[d].prot?" 🔒":""}</td><td>${domName(d)}</td></tr>`).join("")}</tbody></table>
   <p><b>D3 — Severity:</b> six damage dimensions (S1 people, S2 operations/delivery, S3 information/data, S4 product/quality, S5 environment/assets, S6 legal/reporting/reputation), each P1–P4 or “not affected”. The <b>overall level is the maximum</b> — no offsetting between dimensions.</p>
   <table><thead><tr><th>Level</th><th>First response</th><th>Escalation</th><th>Effect</th></tr></thead><tbody>
   <tr><td><span class="badge p1">P1</span> critical</td><td>1 h · 24/7</td><td>E2</td><td>IRT convened; ISO and management notified immediately; final report mandatory</td></tr>
   <tr><td><span class="badge p2">P2</span> high</td><td>4 h · 24/7</td><td>E1</td><td>owner works with the ISO; final report mandatory</td></tr>
   <tr><td><span class="badge p3">P3</span> medium</td><td>8 h · site hours</td><td>E0</td><td>handled in the line process; ISO informed via ticket</td></tr>
   <tr><td><span class="badge p4">P4</span> low</td><td>24 h · site hours</td><td>E0</td><td>monthly trend analysis</td></tr>
   </tbody></table>
   <ul>
    <li><b>Priority rule for danger to people:</b> if S1 = P1/P2 the lead domain switches to E automatically until the hazard has ended (“hazard situation resolved” must be recorded before switching back). Hazard mitigation always takes precedence over documentation.</li>
    <li>A reporting duty with a deadline of ≤ 24 h forces escalation E2 — even below P1.</li>
    <li><b>Downgrades</b> of P1/P2 need an application and ISO approval (four-eyes); until then priority and SLA stay unchanged. Upgrades take effect immediately.</li>
    <li>Similar incidents with the same cause within 30 days are linked and assessed jointly.</li>
    <li><b>Near misses</b> are reportable, get their own portal entry, usually P4 — they are a valued KPI of the reporting culture, not noise.</li>
    <li><b>Triage support:</b> when a threat is selected the tool suggests the primary domain and the typically affected domains per Annex C of the policy; apply with one click — a deviating assignment remains permissible and must be justified.</li>
   </ul>
  </div></details>

  <details><summary>4 · Reporting duties and deadlines (PROC ch. 9)</summary><div class="dbody">
   <p>Every duty creates a scheduled task; due dates are calculated from the <b>time of awareness</b>. The check must be documented even when negative — “not assessed” blocks closure. As soon as a duty is “yes”, a copy of the notification and its acknowledgement must be attached.</p>
   <table><thead><tr><th>Duty</th><th>Deadline</th><th>Responsible</th></tr></thead><tbody>
   <tr><td>NIS-2 (DE; AT/SK/PL per site)</td><td>early warning 24 h · follow-up 72 h · final report 1 month</td><td>ISO</td></tr>
   <tr><td>GDPR Art. 33/34</td><td>72 h</td><td>DPO (added automatically)</td></tr>
   <tr><td>Sec. 35 BSIG — notify service recipients</td><td>without delay</td><td>management approval, ISO drafts</td></tr>
   <tr><td>Customer information — delivery quantity/date</td><td>without delay, next working day at the latest (IATF 16949)</td><td>Supply Chain, management approval</td></tr>
   <tr><td>Customer information — product defect / suspected recall</td><td>without delay; suspected recall forces P1</td><td>Quality management, management approval</td></tr>
   <tr><td>Customer/OEM — customer, development or prototype data</td><td>24 h</td><td>ISO with incident owner</td></tr>
   <tr><td>Accident insurer (accident report)</td><td>3 days (death or &gt;3 days unfit for work)</td><td>Occupational safety + HR</td></tr>
   <tr><td>Occupational safety / environmental authority</td><td>without delay</td><td>Occupational safety / environmental officer</td></tr>
   <tr><td>Employee representation (co-determination)</td><td>without delay — checked for <b>every</b> incident</td><td>HR</td></tr>
   <tr><td>Insurer / certification body / law enforcement</td><td>per Annex D of the policy / management decision</td><td>site / quality management / management</td></tr>
   </tbody></table>
   <p class="small muted">The NIS-2 relevance assessment is performed directly in the ticket (section 2a) using the STD_010.002 form: criteria RK-01–RK-12 under the strictest-threshold principle, Myjava special rules (30/60-min thresholds, Sec. 24(5) additional notifications), an 18-h safety margin for the early-warning decision and documented negation under the four-eyes principle. The materiality assessment (persons affected, economic damage, service impact, reputational damage) is documented in “Justification of classification” — positive or negative. Approval steps never stop the deadline clock; the notification to the authority itself needs no approval.</p>
  </div></details>

  <details><summary>5 · Life cycle: phases, statuses and duties (PROC ch. 8)</summary><div class="dbody">
   <table><thead><tr><th>Phase</th><th>Status</th><th>Key duties</th></tr></thead><tbody>
   <tr><td>1 Identification and reporting</td><td>Open</td><td>subject, site, time of awareness, observation</td></tr>
   <tr><td>2 Recording and triage</td><td>Triage</td><td>lead domain, incident owner, S1–S6, reporting-duty check</td></tr>
   <tr><td>3 Immediate measures</td><td>In progress – Containment</td><td>time-stamped action log; evidence secured (P1/P2) before moving on</td></tr>
   <tr><td>4 Root cause analysis</td><td>In progress – Analysis</td><td>threat reference, immediate and root cause; <b>14 days (P1) / 30 days (P2)</b></td></tr>
   <tr><td>5 Resolution and repair</td><td>In progress – Remediation</td><td>corrective actions, hardening, restoration</td></tr>
   <tr><td>6 Resumption</td><td>Verification and release</td><td>release for resumption; P1/P2: ISO confirmation; product-related: quality management</td></tr>
   <tr><td>7 Follow-up</td><td>Resolved → Closed</td><td>post-incident review ≤ 14 days, final report, lessons learned, risk register reference, effectiveness review after 6 months</td></tr>
   <tr><td>— BCM hand-over (E3)</td><td>Suspended – BCM</td><td>hand-over note mandatory; external deadlines keep running with the ISO</td></tr>
   </tbody></table>
   <p class="small muted">Every status change checks the mandatory fields of the target phase and names missing entries. Reopening closed tickets is reserved to the ISO. For domains F, G, H the specialist process (e.g. 8D/CAPA in CAQ QBD.net) leads — the ticket carries the record number and the result; closure requires the completed record.</p>
  </div></details>

  <details><summary>6 · Documentation, confidentiality and retention (PROC ch. 9.6, 11)</summary><div class="dbody">
   <ul>
    <li><b>Action log:</b> every ordered or executed measure with timestamp and acting person — the ticket activity log complements but never replaces it.</li>
    <li><b>Evidence before restoration</b> (P1/P2): the transition to remediation is blocked until evidence is secured.</li>
    <li><b>No deletion:</b> tickets are never deleted; retention at least 5 years after closure (longer for occupational accidents and product liability).</li>
    <li><b>Protected workspaces E and I:</b> health and personnel data are only visible to the domain group, ISO and DPO; evaluations only aggregated, never per person.</li>
    <li><b>Communication:</b> internal need-to-know only; public statements only via corporate communications after management approval; customer and authority correspondence lives in the ticket, not in personal mailboxes.</li>
   </ul>
  </div></details>

  <details><summary>7 · Key performance indicators (PROC ch. 12)</summary><div class="dbody">
   <table><thead><tr><th>KPI</th><th>Target</th></tr></thead><tbody>
   <tr><td>Complete classification (D1–D4)</td><td>≥ 95 %</td></tr>
   <tr><td>P1 first-response compliance</td><td>100 %</td></tr>
   <tr><td>P2/P3 first-response compliance</td><td>≥ 90 %</td></tr>
   <tr><td>External notifications on time</td><td>100 %</td></tr>
   <tr><td>Root cause analysis within deadline</td><td>≥ 90 %</td></tr>
   <tr><td>Post-incident review ≤ 14 days</td><td>100 %</td></tr>
   <tr><td>Effectiveness review after 6 months</td><td>≥ 90 %</td></tr>
   <tr><td>Near-miss reporting rate</td><td>≥ 1 per 10 employees/year</td></tr>
   <tr><td>Risk-register feedback (P1/P2)</td><td>100 %</td></tr>
   <tr><td>Linkage rate domain H (CAQ)</td><td>100 %</td></tr>
   </tbody></table>
   <p class="small muted">A low near-miss rate signals weak reporting culture — not a fault-free operation.</p>
  </div></details>

  <details><summary>8 · Training (PROC ch. 13)</summary><div class="dbody">
   <table><thead><tr><th>Audience</th><th>Frequency</th><th>Content</th></tr></thead><tbody>
   <tr><td>All employees</td><td>annually</td><td>portal entry, incident vs. service request, near-miss entry</td></tr>
   <tr><td>Triage roles</td><td>every 6 months</td><td>domain assignment, time of awareness, S1–S6, reporting-duty check, threat catalogue</td></tr>
   <tr><td>Incident owners</td><td>every 6 months</td><td>status model, mandatory fields, evidence, leading business record, closure</td></tr>
   <tr><td>ISO / deputy, administrators</td><td>annually</td><td>deadline monitor, approvals, downgrade, BCM hand-over / configuration review</td></tr>
   <tr><td>Cross-functional exercise</td><td>annually</td><td>simulated P1 incident across at least two domains with full ticket handling</td></tr>
   </tbody></table>
  </div></details>

  <div class="note"><b>Binding documents:</b> POL_010.001 V3.00 (policy) · PROC_010.001 V2.10 (process, DE/EN) · STD_010.001 (NIS-2 reporting) · ANL_010.001 (roles, KPIs, evidence). This page is a condensed working aid for tool users, maintained by the ISO.</div>`;

  return `<h1>IRM-Guidance – Incident Response in der Praxis</h1>
  <p class="muted">Verdichtete, nutzerorientierte Kurzfassung der Prozessbeschreibung <b>PROC_010.001 V2.10</b> (Incident-Response-Prozess und -Management in Freshservice, 01.08.2026), die die Richtlinie POL_010.001 V3.00 umsetzt. Diese Seite leitet die tägliche Arbeit mit dem IRM-Tool an. <b>Im Zweifel gelten die vollständigen Dokumente</b> — diese Kurzfassung ersetzt sie nicht.</p>

  <h2>Schnelleinstieg nach Rolle</h2>
  <div class="cards">
   <div class="card"><h3>👤 Ich bin Beschäftigte/r (Melder)</h3>
    <p>Etwas Ungewöhnliches beobachtet? <b>Melden — immer.</b> Über „Incident melden" im Portal (oder den Near-Miss-Einstieg). Sie müssen <b>nichts</b> klassifizieren oder priorisieren; Kurzbeschreibung, Ort und Zeitpunkt genügen. Eine Meldung in gutem Glauben zieht keine Nachteile nach sich. <b>Personen in akuter Gefahr? Erst Notrufkette (112 / Werkschutz), danach melden.</b></p></div>
   <div class="card"><h3>🔎 Ich bin Triage (IT-Helpdesk / Standortverantwortliche)</h3>
    <p>Neue Tickets übernehmen, die <b>Kenntniserlangung</b> prüfen und korrigieren (alle gesetzlichen Fristen laufen ab ihr!), Leitdomäne vorschlagen, die sechs Schadensdimensionen S1–S6 bewerten und die Meldepflichtprüfung vollständig durchführen. Telefonische und mündliche Meldungen unverzüglich erfassen, spätestens bis Schichtende.</p></div>
   <div class="card"><h3>🛠️ Ich bin Incident Owner (Domäne)</h3>
    <p>Sie tragen die fachliche Bearbeitung: jede Sofortmaßnahme mit Zeitstempel und handelnder Person protokollieren, Beweise <b>vor</b> der Wiederherstellung sichern (P1/P2), unmittelbare und Systemursache feststellen, Wiederaufnahme freigeben, Lessons Learned und Wirksamkeitsnachweis liefern.</p></div>
   <div class="card"><h3>🛡️ ISB / Geschäftsleitung / DSB</h3>
    <p>Der ISB bestätigt die Klassifizierung, entscheidet über Meldepflichten und Eskalation, genehmigt Herabstufungen (Vieraugenprinzip) und überwacht den Fristenmonitor. Die Geschäftsleitung gibt Kunden-/Öffentlichkeitskommunikation, Feldmaßnahmen und die BCM-Übergabe frei. Der DSB verantwortet Art. 33/34 DSGVO und wird bei Datenschutzrelevanz automatisch beteiligt.</p></div>
  </div>

  <details open><summary>1 · Zweck, Geltungsbereich und Grundsätze (PROC Kap. 1)</summary><div class="dbody">
   <p>Eine einzige Meldestelle für <b>alle</b> Incidents — IT- und Cyberangriffe ebenso wie Arbeitsunfälle, Brand, Anlagenausfälle, Lieferkettenstörungen, Qualitätsabweichungen oder Compliance-Sachverhalte. Geltungsbereich: Leutenbach (DE), Bischofshofen (AT), Graz (AT), Myjava (SK), Międzyrzecze Górne (PL) sowie Mexiko und Indien im erweiterten Governance-Geltungsbereich.</p>
   <ul>
    <li>Jeder Incident wird <b>vierdimensional</b> klassifiziert: D1 Domäne, D2 Gefährdungsbezug, D3 Schweregrad, D4 Meldepflichtrelevanz.</li>
    <li>Der Schweregrad wird aus sechs Schadensdimensionen <b>berechnet</b> (Höchstwertprinzip) — nie frei vergeben.</li>
    <li>Alle externen Fristen laufen ab der <b>Kenntniserlangung</b>, nicht ab Ticketerstellung.</li>
    <li>Der gesamte Lebenszyklus wird revisionssicher im Ticket geführt; Tickets werden nie gelöscht.</li>
   </ul>
  </div></details>

  <details><summary>2 · Meldewege — alle gleichwertig (PROC Kap. 6.1.1)</summary><div class="dbody">
   <table><thead><tr><th>Meldeweg</th><th>Erfassung durch</th><th>Regel</th></tr></thead><tbody>
   <tr><td>Serviceportal / Incident-E-Mail-Adresse</td><td>System</td><td>unmittelbare Ticketerzeugung</td></tr>
   <tr><td>Telefonisch/mündlich an Vorgesetzte oder Schichtleitung</td><td>Vorgesetzte / Schichtleitung</td><td>unverzüglich erfassen, spätestens bis Schichtende; meldende Person als Quelle nennen</td></tr>
   <tr><td>Meldung an den Standortverantwortlichen</td><td>Standortverantwortlicher</td><td>unverzüglich; außerhalb der Betriebszeit über die Standortbereitschaft</td></tr>
   <tr><td>Direkt an den ISB (Bereitschaftsnummer)</td><td>ISB / Vertretung</td><td>gilt ausdrücklich auch bei Ausfall des Ticketsystems</td></tr>
   <tr><td>Betriebliche Notrufkette</td><td>Standortverantwortlicher nach Ende der Gefahrenlage</td><td>Gefahrenabwehr geht vor; danach mit dem <b>tatsächlichen</b> Zeitpunkt der Kenntniserlangung erfassen</td></tr>
   <tr><td>Qualitätsmanagementsystem (CAQ QBD.net)</td><td>Leitung Qualitätsmanagement</td><td>zusätzliche Incident-Meldung bei Abweichungen P1–P3</td></tr>
   <tr><td>Hinweisgebersystem</td><td>Compliance-Verantwortlicher</td><td>kein automatischer Übertrag; bei Sicherheitsbezug anonymisiertes Ticket</td></tr>
   </tbody></table>
   <p class="small muted">Bei Ausfall des Ticketsystems: telefonische Meldung an ISB oder Standortverantwortlichen; Nacherfassung innerhalb von 24 Stunden (papiergebundenes Formular am Standort).</p>
  </div></details>

  <details><summary>3 · Klassifizierung: Domänen, S1–S6, Gesamtstufe (PROC Kap. 6.2–6.4, 7)</summary><div class="dbody">
   <p><b>D1 — Leitdomäne</b> (steuert Gruppe, Arbeitsbereich und Pflichten):</p>
   <table><tbody>${DOMKEYS.map(d=>`<tr><td><b>${d}</b>${DOM[d].prot?" 🔒":""}</td><td>${domName(d)}</td></tr>`).join("")}</tbody></table>
   <p><b>D3 — Schweregrad:</b> sechs Schadensdimensionen (S1 Personen, S2 Betrieb/Lieferfähigkeit, S3 Information/Daten, S4 Produkt/Qualität, S5 Umwelt/Sachwerte, S6 Recht/Meldepflicht/Reputation), jeweils P1–P4 oder „nicht betroffen". Die <b>Gesamtstufe ist der Höchstwert</b> — eine Kompensation zwischen den Dimensionen findet nicht statt.</p>
   <table><thead><tr><th>Stufe</th><th>Erstreaktion</th><th>Eskalation</th><th>Wirkung</th></tr></thead><tbody>
   <tr><td><span class="badge p1">P1</span> kritisch</td><td>1 h · 24/7</td><td>E2</td><td>IRT wird einberufen; ISB und Geschäftsleitung unverzüglich benachrichtigt; Abschlussbericht Pflicht</td></tr>
   <tr><td><span class="badge p2">P2</span> hoch</td><td>4 h · 24/7</td><td>E1</td><td>Owner in Abstimmung mit dem ISB; Abschlussbericht Pflicht</td></tr>
   <tr><td><span class="badge p3">P3</span> mittel</td><td>8 h · Betriebszeit</td><td>E0</td><td>Bearbeitung im Fachprozess; ISB erhält Kenntnis über das Ticket</td></tr>
   <tr><td><span class="badge p4">P4</span> niedrig</td><td>24 h · Betriebszeit</td><td>E0</td><td>monatliche Trendanalyse</td></tr>
   </tbody></table>
   <ul>
    <li><b>Vorrangregel Personengefährdung:</b> bei S1 = P1/P2 wechselt die Leitdomäne automatisch auf E, bis die Gefahrenlage beendet ist („Gefahrenlage beendet" muss vor dem Rückwechsel erfasst sein). Gefahrenabwehr geht immer vor Dokumentation.</li>
    <li>Eine Meldepflicht mit Frist ≤ 24 h erzwingt Eskalationsstufe E2 — auch unterhalb von P1.</li>
    <li><b>Herabstufungen</b> von P1/P2 nur über Antrag und ISB-Genehmigung (Vieraugenprinzip); bis dahin bleiben Priorität und SLA unverändert. Höherstufungen wirken sofort.</li>
    <li>Gleichartige Incidents derselben Ursache innerhalb von 30 Tagen werden verknüpft und gemeinsam bewertet.</li>
    <li><b>Near Misses</b> sind meldepflichtig, haben einen eigenen Portaleinstieg, i. d. R. P4 — sie sind eine erwünschte Kennzahl der Meldekultur, kein Störfaktor.</li>
    <li><b>Triage-Unterstützung:</b> Bei Auswahl einer Gefährdung schlägt das Tool die Primärdomäne und die regelmäßig ebenfalls betroffenen Domänen nach Anhang C der Richtlinie vor; die Übernahme erfolgt per Klick, eine abweichende Zuordnung bleibt zulässig und ist zu begründen.</li>
   </ul>
  </div></details>

  <details><summary>4 · Meldepflichten und Fristen (PROC Kap. 9)</summary><div class="dbody">
   <p>Jede Pflicht erzeugt eine terminierte Aufgabe; die Fälligkeit wird aus der <b>Kenntniserlangung</b> berechnet. Die Prüfung ist auch bei negativem Ergebnis zu dokumentieren — „nicht geprüft" blockiert den Abschluss. Sobald eine Pflicht auf „ja" steht, sind Meldung und Empfangsbestätigung als Anlage zu hinterlegen.</p>
   <table><thead><tr><th>Pflicht</th><th>Frist</th><th>Verantwortlich</th></tr></thead><tbody>
   <tr><td>NIS-2 (DE; AT/SK/PL je Standort)</td><td>Frühwarnung 24 h · Folgemeldung 72 h · Abschlussmeldung 1 Monat</td><td>ISB</td></tr>
   <tr><td>DSGVO Art. 33/34</td><td>72 h</td><td>DSB (wird automatisch beteiligt)</td></tr>
   <tr><td>§ 35 BSIG — Unterrichtung der Empfänger von Diensten</td><td>unverzüglich</td><td>Freigabe Geschäftsleitung, Vorschlag ISB</td></tr>
   <tr><td>Kundeninformation — Liefermenge/Liefertermin</td><td>unverzüglich, spätestens am folgenden Arbeitstag (IATF 16949)</td><td>Supply Chain, Freigabe GL</td></tr>
   <tr><td>Kundeninformation — Produktfehler / Rückrufverdacht</td><td>unverzüglich; Rückrufverdacht erzwingt P1</td><td>Qualitätsleitung, Freigabe GL</td></tr>
   <tr><td>Kunden-/OEM-Info — Kunden-, Entwicklungs- oder Prototypendaten</td><td>24 h</td><td>ISB mit Incident Owner</td></tr>
   <tr><td>Unfallversicherungsträger (Unfallanzeige)</td><td>3 Tage (Tod oder Arbeitsunfähigkeit &gt; 3 Tage)</td><td>Arbeitssicherheit + Personalwesen</td></tr>
   <tr><td>Arbeitsschutz-/Umweltbehörde</td><td>unverzüglich</td><td>Fachkraft für Arbeitssicherheit / Umweltmanagementbeauftragter</td></tr>
   <tr><td>Arbeitnehmervertretung (Mitbestimmung)</td><td>unverzüglich — bei <b>jedem</b> Incident zu prüfen</td><td>Personalwesen</td></tr>
   <tr><td>Versicherer / Zertifizierungsstelle / Strafverfolgung</td><td>gem. Anhang D der Richtlinie / Entscheidung GL</td><td>Standort / Qualitätsleitung / GL</td></tr>
   </tbody></table>
   <p class="small muted">Die NIS-2-Relevanzbewertung erfolgt direkt im Ticket (Abschnitt 2a) anhand des Prüfbogens der STD_010.002: Kriterien RK-01–RK-12 nach dem Prinzip der strengsten Schwelle, Myjava-Sonderregeln (30/60-min-Schwellen, § 24 Abs. 5-Zusatzmeldungen), 18-h-Sicherheitsabstand für die Frühwarnungsentscheidung und dokumentierte Verneinung im Vier-Augen-Prinzip. Die Erheblichkeitsbewertung (betroffene Personen, wirtschaftlicher Schaden, Auswirkung auf die Dienste, Ansehensschaden) wird im Feld „Begründung der Einstufung" dokumentiert — positiv wie negativ. Genehmigungsschritte halten die Fristenuhr nie an; die Behördenmeldung selbst ist nicht genehmigungspflichtig.</p>
  </div></details>

  <details><summary>5 · Lebenszyklus: Phasen, Status und Pflichten (PROC Kap. 8)</summary><div class="dbody">
   <table><thead><tr><th>Phase</th><th>Status</th><th>Wesentliche Pflichten</th></tr></thead><tbody>
   <tr><td>1 Erkennung und Meldung</td><td>Open</td><td>Betreff, Standort, Kenntniserlangung, Beobachtung</td></tr>
   <tr><td>2 Erfassung und Triage</td><td>Triage</td><td>Leitdomäne, Incident Owner, S1–S6, Meldepflichtprüfung</td></tr>
   <tr><td>3 Sofortmaßnahmen</td><td>In Bearbeitung – Eindämmung</td><td>Maßnahmenprotokoll mit Zeitstempel; Beweissicherung (P1/P2) vor dem Weitergehen</td></tr>
   <tr><td>4 Ursachenanalyse</td><td>In Bearbeitung – Analyse</td><td>Gefährdungsbezug, unmittelbare und Systemursache; <b>14 Tage (P1) / 30 Tage (P2)</b></td></tr>
   <tr><td>5 Beseitigung</td><td>In Bearbeitung – Behebung</td><td>Korrekturmaßnahmen, Härtung, Instandsetzung</td></tr>
   <tr><td>6 Wiederaufnahme</td><td>Verifikation und Freigabe</td><td>Freigabe der Wiederaufnahme; P1/P2: Bestätigung ISB; Produktbezug: Qualitätsleitung</td></tr>
   <tr><td>7 Nachbereitung</td><td>Resolved → Closed</td><td>Post-Incident-Review ≤ 14 Tage, Abschlussbericht, Lessons Learned, Referenz Risikoregister, Wirksamkeitsprüfung nach 6 Monaten</td></tr>
   <tr><td>— BCM-Übergabe (E3)</td><td>Ausgesetzt – BCM</td><td>Übergabenotiz Pflicht; externe Fristen laufen beim ISB weiter</td></tr>
   </tbody></table>
   <p class="small muted">Jeder Statuswechsel prüft die Pflichtfelder der Zielphase und benennt fehlende Angaben. Das Wiederöffnen abgeschlossener Tickets ist dem ISB vorbehalten. Für die Domänen F, G, H führt der Fachprozess (z. B. 8D/CAPA in CAQ QBD.net) — das Ticket trägt Vorgangsnummer und Ergebnis; der Abschluss setzt den abgeschlossenen Fachvorgang voraus.</p>
  </div></details>

  <details><summary>6 · Dokumentation, Vertraulichkeit und Aufbewahrung (PROC Kap. 9.6, 11)</summary><div class="dbody">
   <ul>
    <li><b>Maßnahmenprotokoll:</b> jede angeordnete oder durchgeführte Maßnahme mit Zeitstempel und handelnder Person — das Ticket-Aktivitätsprotokoll ergänzt, ersetzt es aber nicht.</li>
    <li><b>Beweissicherung vor Wiederherstellung</b> (P1/P2): der Wechsel in die Behebungsphase ist bis zur gesetzten Beweissicherung blockiert.</li>
    <li><b>Keine Löschung:</b> Tickets werden nie gelöscht; Aufbewahrung mindestens 5 Jahre nach Abschluss (länger bei Arbeitsunfällen und Produkthaftung).</li>
    <li><b>Geschützte Arbeitsbereiche E und I:</b> Gesundheits- und Personaldaten sehen nur die Domänengruppe, der ISB und der DSB; Auswertungen nur aggregiert, nie personenbezogen.</li>
    <li><b>Kommunikation:</b> intern nur im Kreis der Beteiligten; öffentliche Aussagen nur über die Unternehmenskommunikation nach GL-Freigabe; Kunden- und Behördenkorrespondenz gehört ins Ticket, nicht in persönliche Postfächer.</li>
   </ul>
  </div></details>

  <details><summary>7 · Kennzahlen (PROC Kap. 12)</summary><div class="dbody">
   <table><thead><tr><th>Kennzahl</th><th>Zielwert</th></tr></thead><tbody>
   <tr><td>Vollständige Klassifizierung (D1–D4)</td><td>≥ 95 %</td></tr>
   <tr><td>Reaktionszeit P1 eingehalten</td><td>100 %</td></tr>
   <tr><td>Reaktionszeit P2/P3 eingehalten</td><td>≥ 90 %</td></tr>
   <tr><td>Fristgerechte externe Meldungen</td><td>100 %</td></tr>
   <tr><td>Ursachenanalyse in der Frist</td><td>≥ 90 %</td></tr>
   <tr><td>Post-Incident-Review ≤ 14 Tage</td><td>100 %</td></tr>
   <tr><td>Wirksamkeitsnachweis nach 6 Monaten</td><td>≥ 90 %</td></tr>
   <tr><td>Meldequote Near Miss</td><td>≥ 1 je 10 Beschäftigte/Jahr</td></tr>
   <tr><td>Rückkopplung Risikoregister (P1/P2)</td><td>100 %</td></tr>
   <tr><td>Verknüpfungsquote Domäne H (CAQ)</td><td>100 %</td></tr>
   </tbody></table>
   <p class="small muted">Eine niedrige Near-Miss-Quote ist ein Hinweis auf unzureichende Meldebereitschaft — nicht auf störungsfreien Betrieb.</p>
  </div></details>

  <details><summary>8 · Schulung (PROC Kap. 13)</summary><div class="dbody">
   <table><thead><tr><th>Zielgruppe</th><th>Frequenz</th><th>Inhalte</th></tr></thead><tbody>
   <tr><td>Alle Beschäftigten</td><td>jährlich</td><td>Portaleinstieg, Incident vs. Servicewunsch, Near-Miss-Einstieg</td></tr>
   <tr><td>Triage-Rollen</td><td>halbjährlich</td><td>Domänenzuordnung, Kenntniserlangung, S1–S6, Meldepflichtprüfung, Gefährdungskatalog</td></tr>
   <tr><td>Incident Owner</td><td>halbjährlich</td><td>Statusmodell, Pflichtfelder, Beweissicherung, Fachvorgang, Abschluss</td></tr>
   <tr><td>ISB / Vertretung, Administration</td><td>jährlich</td><td>Fristenmonitor, Genehmigungen, Herabstufung, BCM-Übergabe / Konfigurationsreview</td></tr>
   <tr><td>Bereichsübergreifende Übung</td><td>jährlich</td><td>simulierter P1-Incident über mindestens zwei Domänen mit vollständiger Ticketführung</td></tr>
   </tbody></table>
  </div></details>

  <div class="note"><b>Verbindliche Dokumente:</b> POL_010.001 V3.00 (Richtlinie) · PROC_010.001 V2.10 (Prozess, DE/EN) · STD_010.001 (NIS-2-Meldung) · ANL_010.001 (Rollen, KPI, Nachweise). Diese Seite ist eine verdichtete Arbeitshilfe für die Tool-Nutzer und wird durch den ISB gepflegt.</div>`;
}

function viewDoku(){
  if(S.lang==="en") return `<h1>Implementation information</h1>
  <div class="note"><b>Positioning:</b> This prototype implements the implementation recommendation <b>GDL_010.001 V1.00</b> (Freshservice implementation of Incident Response Management, 2026-08-01) as a runnable reference. It serves to validate the field, status and deadline model <b>before</b> the actual Freshservice configuration – it replaces neither a ticket system nor a server database (storage in the browser only; transfer via “Save/Load state”).</div>

  <tr><td>9/11</td><td>Response times P1–P4, escalation 50/75 %, notification triggers</td><td>Deadline monitor with traffic light; P1 banner (real alerting only in Freshservice)</td></tr>

  <tr><td>STD_010.002</td><td>NIS-2 relevance assessment: form Annex A (RK-01–RK-12), Myjava special check, 18-h safety margin, four-eyes negation, transfer into the country reporting duties</td><td>Section “2a” in the ticket detail; blocking at triage (system involvement + part 2) and at closure (complete form); automatic tasks (18 h, Sec. 24(5) SK)</td></tr>
