<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REUTIB · Incident Response Management (IRM) – Prototyp</title>
<style>
:root{
  --rot:#E30513;      /* nur Logo/Wortmarke */
  --gelb:#FED22C;
  --anthrazit:#3E3E3E;
  --grau:#5A5859;
  --hellgrau:#F0F0F0;
  --ok:#2e7d32;
  --warn:#b26a00;
  --crit:#8e0000;
  --line:#d7d7d7;
  --bg:#fff;
  --fg:#000;
  --soft:#fafafa;
  --head:#3E3E3E;
  --headfg:#fff;
}
:root[data-theme=dark]{
  --anthrazit:#c9c9c9;
  --grau:#a5a3a4;
  --hellgrau:#242424;
  --ok:#6fbf73;
  --warn:#e0a437;
  --crit:#e57373;
  --line:#3d3d3d;
  --bg:#161616;
  --fg:#ececec;
  --soft:#1d1d1d;
  --head:#2e2e2e;
  --headfg:#ececec;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Roboto Condensed","Arial Narrow",Arial,sans-serif;color:var(--fg);background:var(--bg);font-size:15px}
header{background:var(--bg);border-bottom:3px solid var(--gelb);padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{font-weight:700;font-size:20px;letter-spacing:.5px}
.brand .r{color:var(--rot)}
.brand small{display:block;font-weight:400;color:var(--grau);font-size:12px;letter-spacing:0}
.spacer{flex:1}
select,input,textarea,button{font-family:inherit;font-size:14px}
select,input[type=text],input[type=datetime-local],input[type=date],textarea{border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:var(--bg);color:var(--fg);width:100%}
textarea{min-height:64px;resize:vertical}
label{display:block;font-weight:700;font-size:12.5px;color:var(--anthrazit);margin:10px 0 3px}
label .req{color:var(--warn)}
label .hint{font-weight:400;color:var(--grau)}
button{cursor:pointer;border:1px solid var(--anthrazit);background:var(--head);color:var(--headfg);border-radius:4px;padding:7px 14px;font-weight:700}
button.sec{background:var(--bg);color:var(--anthrazit)}
button.acc{background:var(--gelb);color:#000;border-color:var(--gelb)}
button:disabled{opacity:.45;cursor:not-allowed}
.mini{padding:4px 9px;font-size:13px}
nav{background:var(--hellgrau);padding:0 18px;display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav button{background:none;border:none;color:var(--anthrazit);padding:11px 14px;border-radius:0;border-bottom:3px solid transparent;font-weight:700}
nav button.active{border-bottom-color:var(--gelb);background:var(--bg)}
main{padding:18px;max-width:1400px;margin:0 auto}
h1{font-size:21px;margin:.2em 0 .5em}
h2{font-size:17px;margin:1.2em 0 .4em}
h3{font-size:14.5px;margin:1em 0 .3em;color:var(--anthrazit)}
.rolebox{display:flex;align-items:center;gap:8px;background:var(--hellgrau);border-radius:6px;padding:5px 10px}
.rolebox b{font-size:12.5px;color:var(--anthrazit)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:14px 0}
.card{border:1px solid var(--line);border-radius:8px;padding:16px;background:var(--bg)}
.card.portal{cursor:pointer;border-top:4px solid var(--gelb)}
.card.portal:hover{background:var(--hellgrau)}
.card.portal h3{margin-top:0;font-size:16px;color:var(--fg)}
.card.danger{border-top-color:var(--anthrazit)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.kpi{background:var(--hellgrau);border-radius:8px;padding:12px}
.kpi .v{font-size:26px;font-weight:700}
.kpi .l{font-size:12px;color:var(--grau);font-weight:700}
table{border-collapse:collapse;width:100%;margin:8px 0;background:var(--bg)}
th{background:var(--head);color:var(--headfg);text-align:left;font-size:12.5px;padding:7px 9px;position:sticky;top:0}
td{border-bottom:1px solid var(--line);padding:7px 9px;font-size:13.5px;vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--hellgrau)}
tr:nth-child(even) td{background:var(--soft)}
.badge{display:inline-block;border-radius:10px;padding:1.5px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.p1{background:#000;color:#fff;border:1px solid #666}
.p2{background:#3E3E3E;color:#fff}
.p3{background:#5A5859;color:#fff}
.p4{background:var(--hellgrau);color:var(--fg);border:1px solid var(--line)}
:root[data-theme=dark] .p1{background:#ececec;color:#111;border:1px solid #ececec}
.pn{background:var(--bg);color:var(--grau);border:1px dashed var(--grau)}
.e0{background:var(--hellgrau);color:var(--fg)}
.e1{background:var(--gelb);color:#000}
.e2{background:#3E3E3E;color:#fff;border:1px solid #777}
.e3{background:#000;color:#fff;border:1px solid #777}
:root[data-theme=dark] .e3{background:#ececec;color:#111}
.st{background:var(--hellgrau);border:1px solid var(--line);color:var(--fg)}
.dom{background:var(--bg);border:1px solid var(--anthrazit);color:var(--anthrazit)}
.lock{background:var(--head);color:var(--headfg)}
.amp{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.amp.g{background:var(--ok)}.amp.y{background:var(--gelb);border:1px solid #b29200}.amp.o{background:var(--warn)}.amp.r{background:var(--crit)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 22px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
.section{border:1px solid var(--line);border-radius:8px;margin:14px 0;background:var(--bg)}
.section>.head{background:var(--hellgrau);padding:9px 14px;font-weight:700;color:var(--anthrazit);border-radius:8px 8px 0 0;display:flex;align-items:center;gap:10px}
.section>.body{padding:6px 14px 14px}
.note{background:var(--hellgrau);border-left:4px solid var(--gelb);padding:9px 12px;margin:10px 0;font-size:13.5px}
.err{background:var(--hellgrau);border-left:4px solid var(--crit);padding:9px 12px;margin:10px 0;font-size:13.5px;color:var(--fg);font-weight:700}
.oklight{border-left-color:var(--ok)}
.muted{color:var(--grau)}
.small{font-size:12.5px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:10px 0}
.filter>div{min-width:140px}
.statusflow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center}
.statusflow .chip{padding:5px 10px;border-radius:14px;border:1px solid var(--line);font-size:12.5px;background:var(--bg)}
.statusflow .chip.cur{background:var(--gelb);border-color:var(--gelb);font-weight:700;color:#000}
.log{font-size:12.5px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--soft)}
.log div{padding:2px 0;border-bottom:1px dotted var(--line)}
.taskrow.done{opacity:.55;text-decoration:line-through}
footer{padding:20px;text-align:center;color:var(--grau);font-size:12px;border-top:1px solid var(--line);margin-top:30px}
a{color:var(--anthrazit)}
.help{cursor:help;border-bottom:1px dotted var(--grau)}
dialog{border:1px solid var(--anthrazit);border-radius:8px;max-width:560px;padding:18px;background:var(--bg);color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.matrix td.n0{color:var(--line)}
.langbtn{border:1px solid var(--line);background:var(--bg);color:var(--grau);padding:5px 9px;font-weight:700}
.langbtn.on{background:var(--gelb);color:#000;border-color:var(--gelb)}
@media print{header,nav,.noprint{display:none}}
</style>
</head>

<header>
  <div class="brand"><span class="r">REUTTER</span> GROUP <small id="brandSub"></small></div>

    <button class="sec mini" id="btnTheme" onclick="toggleTheme()" title="Hell/Dunkel – Light/Dark">🌓</button>
    <button class="sec mini" id="btnExp" onclick="exportJson()"></button>
    <button class="sec mini" id="btnImp" onclick="document.getElementById('impFile').click()"></button>
    <input type="file" id="impFile" accept=".json" style="display:none" onchange="importJson(event)">

</header>

<main id="main"></main>

/* ---------- Helpers ---------- */
const $ = id=>document.getElementById(id);
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const now = ()=>Date.now();
function fmt(ts){ if(!ts) return "–"; const d=new Date(ts); const loc=S.lang==="en"?"en-GB":"de-DE";
  return d.toLocaleDateString(loc)+" "+d.toLocaleTimeString(loc,{hour:"2-digit",minute:"2-digit"}); }
function fmtRest(ms){
  const neg = ms<0; ms=Math.abs(ms);
  const h=Math.floor(ms/3600000), m=Math.floor(ms%3600000/60000);
  const dayU = S.lang==="en"?" d ":" Tg ";
  const s = h>=48 ? Math.floor(h/24)+dayU+(h%24)+" h" : h+" h "+String(m).padStart(2,"0")+" min";
  return (neg?tr("überfällig seit "):"")+s;
}
function dtLocal(ts){ const d=new Date(ts); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function parseDt(v){ return v? new Date(v).getTime() : null; }
function roleLabel(){ return tr(ROLES[S.role].l) + (S.role==="dombearb" ? " – "+tr("Domäne")+" "+S.roleDom : ""); }
function log(t, txt){ t.log.unshift({ts:now(), who:roleLabel(), txt}); }

/* ---------- Severity (GDL Kap. 6.3) ---------- */
const ORD = {"P1":4,"P2":3,"P3":2,"P4":1,"nicht betroffen":0,"":0,undefined:0};
function computed(t){
  let mx = 0;
  for(const [k] of SDIM) mx = Math.max(mx, ORD[t[k]]||0);
  let stufe = mx>=4?"P1":mx===3?"P2":mx===2?"P3":mx===1?"P4":null;
  let esk = stufe==="P1"?"E2":stufe==="P2"?"E1":"E0";
  /* Regel 12: Rückrufverdacht → Zwangsstufe P1 */
  if(t.leitdomaene==="H" && t.pf.kunde_produkt==="ja"){ stufe="P1"; esk="E2"; }
  /* Regel 5: externe Meldepflicht ≤ 24 h auf „ja“ → E2 */
  const p24 = PFL.some(p=>p.tasks.some(x=>x[1]<=24) && t.pf[p.id]==="ja");
  if(p24) esk="E2";
  if(t.eskOverride==="E3") esk="E3";
  return {stufe, esk};
}
function effStufe(t){ return t.herabStufe && t.herab==="genehmigt" ? t.herabStufe : computed(t).stufe; }
function effEsk(t){ return computed(t).esk; }
const SLA_H = {P1:1,P2:4,P3:8,P4:24};

/* ---------- Sichtbarkeit / Berechtigungen ---------- */
function isProtected(t){ return t.leitdomaene && DOM[t.leitdomaene].prot; }
function canSee(t){
  switch(S.role){
    case "isb": return true;
    case "dsb": return true;
    case "gl": return !isProtected(t);
    case "auditor": return !isProtected(t);
    case "triage": return !isProtected(t);
    case "dombearb": return isProtected(t) ? t.leitdomaene===S.roleDom
                     : (!t.leitdomaene || t.leitdomaene===S.roleDom || (t.nebendomaenen||[]).includes(S.roleDom));
    case "melder": return false;
    default: return false;
  }
}
function canEdit(t){
  if(["auditor","melder","gl"].includes(S.role)) return false;
  if(S.role==="dsb") return t.pf.dsgvo==="ja" || t.leitdomaene==="J";
  return canSee(t);
}

/* ---------- Meldeaufgaben / Fristen ab Kenntniserlangung ---------- */
function syncTasks(t){
  for(const p of PFL){
    const active = t.pf[p.id]==="ja";
    for(const [name,h] of p.tasks){
      let task = t.tasks.find(x=>x.origin===p.id && x.name===name);
      if(active && !task){
        t.tasks.push({id:Math.random().toString(36).slice(2), origin:p.id, name, rolle:p.rolle, due:t.kenntnis+h*3600000, done:false});
        log(t, tr("Meldeaufgabe erzeugt:")+" "+taskLabel(name)+" ("+tr("fällig")+" "+fmt(t.kenntnis+h*3600000)+", "+tr("Frist ab Kenntniserlangung")+")");
      } else if(active && task && !task.done){
        const soll = t.kenntnis+h*3600000;
        if(task.due!==soll){ task.due=soll; log(t,tr("Meldeaufgabe neu terminiert:")+" "+taskLabel(name)+" → "+fmt(soll)); }
      } else if(!active && task && !task.done){
        t.tasks = t.tasks.filter(x=>x!==task);
        log(t,tr("Meldeaufgabe entfernt (Meldepflicht nicht mehr aktiv):")+" "+taskLabel(name));
      }
    }
    if(active && p.appr && !t.approvals.find(a=>a.key===p.id)){
      t.approvals.push({key:p.id, l:"Freigabe: "+p.l, by:p.appr, state:"offen"});
      log(t,tr("Genehmigungsschritt angelegt:")+" "+tr(p.l)+" ("+tr(p.appr)+")");
    }
    if(active && p.dsb && !t.beobachter.includes("Datenschutzbeauftragter")){
      t.beobachter.push("Datenschutzbeauftragter");
      log(t,tr("Datenschutzbeauftragter als Beobachter gesetzt (Art. 33/34)."));
    }
  }
}

/* Vorrangregel Personengefährdung (Regel 6 / Testfall 16) */
function vorrang(t){
  if(["P1","P2"].includes(t.s1) && t.leitdomaene && t.leitdomaene!=="E"){
    const alt = t.leitdomaene;
    if(!t.nebendomaenen.includes(alt)) t.nebendomaenen.push(alt);
    t.leitdomaene = "E";
    t.owner = ownerFor(t);
    t.approvals.push({key:"vorrang"+now(), l:"Bestätigung Vorrangregel Personengefährdung (Leitdomäne → E, vormals "+alt+")", by:"ISB", state:"offen"});
    log(t,tr("VORRANGREGEL: S1")+"="+t.s1+" → "+tr("Leitdomäne wechselt selbsttätig auf E; bisherige Domäne wird Nebendomäne. Bestätigungsaufgabe an den ISB.")+" ["+alt+"]");
  }
}
function ownerFor(t){
  if(!t.leitdomaene) return "";
  const d = DOM[t.leitdomaene];
  return "Incident Owner "+t.leitdomaene+(d.site && t.standort && t.standort!=="standortübergreifend" ? " · "+t.standort : "");
}

/* ---------- Statusübergänge (GDL Kap. 7) ---------- */
function allowedNext(t){
  const st = effStufe(t);
  switch(t.status){
    case "Open": return ["Triage"];
    case "Triage": return st==="P4" ? ["In Bearbeitung – Eindämmung","Resolved"] : ["In Bearbeitung – Eindämmung"];
    case "In Bearbeitung – Eindämmung": return ["In Bearbeitung – Analyse","Ausgesetzt – BCM"];
    case "In Bearbeitung – Analyse": return ["In Bearbeitung – Behebung","Ausgesetzt – BCM"];
    case "In Bearbeitung – Behebung": return ["Verifikation und Freigabe","Ausgesetzt – BCM"];
    case "Verifikation und Freigabe": return ["Resolved"];
    case "Resolved": return ["Closed"];
    case "Ausgesetzt – BCM": return ["In Bearbeitung – Eindämmung","In Bearbeitung – Analyse","In Bearbeitung – Behebung"];
    case "Closed": return S.role==="isb" ? ["Triage"] : [];
  }
  return [];
}
function checkTransition(t, to){
  const miss = [];
  const st = effStufe(t);
  const p12 = ["P1","P2"].includes(st);
  const M = (de,en)=>miss.push(S.lang==="en"?en:de);
  if(t.status==="Open" && to==="Triage"){
    if(!t.kenntnis) M("Kenntniserlangung","Time of awareness");
    if(!t.standort) M("Standort","Site");
  }
  if(t.status==="Triage" && to!=="Triage"){
    if(!t.leitdomaene) M("Leitdomäne","Lead domain");
    if(!t.owner) M("Incident Owner","Incident owner");
    for(const [k,l] of SDIM) if(!t[k]) miss.push(tr(l));
    for(const p of PFL){ if(p.opt) continue;
      if(p.app(t) && (!t.pf[p.id] || t.pf[p.id]==="nicht geprüft"))
        M("Meldepflicht „"+p.l+"“ (steht auf „nicht geprüft“)","Reporting duty “"+tr(p.l)+"” (still “not assessed”)");
    }
    if(needBegruendungAbw(t) && !t.kenntnisBegr) M("Begründung der Abweichung Kenntniserlangung/Erstellung (> 1 h)","Justification of the gap between awareness and creation (> 1 h)");
  }
  if(t.status==="In Bearbeitung – Eindämmung" && to==="In Bearbeitung – Analyse"){
    if(!t.sofort) M("Sofortmaßnahmen (Protokoll)","Immediate actions (log)");
    if(p12 && !t.beweis) M("Beweissicherung erfolgt (Pflicht bei P1/P2)","Evidence secured (mandatory for P1/P2)");
  }
  if(t.status==="In Bearbeitung – Analyse" && to==="In Bearbeitung – Behebung"){
    if(!t.gef || t.gef==="noch nicht bestimmt") M("Gefährdungsbezug (steht auf „noch nicht bestimmt“)","Threat reference (still “not yet determined”)");
    if(p12 && !t.ursache1) M("Unmittelbare Ursache (Pflicht bei P1/P2)","Immediate cause (mandatory for P1/P2)");
    if(p12 && !t.ursache2) M("Systemursache (Pflicht bei P1/P2)","Root cause (mandatory for P1/P2)");
  }
  if(t.status==="Verifikation und Freigabe" && to==="Resolved"){
    if(!t.freigabe) M("Freigabe der Wiederaufnahme","Release for resumption");
    if(p12 && !t.freigabeIsb) M("Bestätigung des ISB (Pflicht bei P1/P2)","ISB confirmation (mandatory for P1/P2)");
    if(t.pf.kunde_produkt==="ja" && !t.freigabeQl) M("Bestätigung der Qualitätsleitung (Produktbezug)","Quality management confirmation (product-related)");
  }
  if(to==="Closed"){
    if(p12){
      if(!t.abschlussbericht) M("Abschlussbericht (Anlage, ISMS-TMPL-006a)","Final report (attachment, ISMS-TMPL-006a)");
      if(!t.lessons) M("Lessons Learned","Lessons learned");
      if(!t.risikoRef) M("Referenz Risikoregister","Risk register reference");
    }
    if(["F","G","H"].includes(t.leitdomaene)){
      if(!t.fvAbgeschlossen) M("Fachvorgang abgeschlossen (Domäne "+t.leitdomaene+")","Business record completed (domain "+t.leitdomaene+")");
      if(!t.fvNummer) M("Führender Fachvorgang – Nummer","Leading business record – number");
    }
    if(t.gef==="noch nicht bestimmt"||!t.gef) M("Gefährdungsbezug","Threat reference");
  }
  if(to==="Ausgesetzt – BCM"){
    if(!t.bcmNote) M("Übergabeprotokoll BCM (Notiz)","BCM hand-over record (note)");
  }
  return miss;
}
function needBegruendungAbw(t){ return t.kenntnis && t.erstellt && (t.erstellt - t.kenntnis) > 3600000; }

/* Nachbereitung (Regeln 17/18) */
function afterTransition(t, to){
  const st = effStufe(t);
  if(to==="Resolved" && ["P1","P2"].includes(st)){
    addOnce(t,"nb1","Post-Incident-Review durchführen","Incident Owner",14*24);
    addOnce(t,"nb2","Abschlussbericht und Risikobewertung erstellen","Incident Owner / ISB",30*24);
  }
  if(to==="Closed" && ["P1","P2"].includes(st)){
    addOnce(t,"nb3","Wirksamkeitsprüfung der Maßnahmen","ISB",183*24);
    t.wirksamkeit = now()+183*24*3600000;
  }
}
function addOnce(t, key, name, rolle, hours){
  if(!t.tasks.find(x=>x.origin===key)){
    t.tasks.push({id:Math.random().toString(36).slice(2), origin:key, name, rolle, due:now()+hours*3600000, done:false});
    log(t,tr("Aufgabe erzeugt:")+" "+taskLabel(name)+" ("+tr("fällig")+" "+fmt(now()+hours*3600000)+")");
  }
}

function newTicket(o){
  const ts = now();
  const t = {
    id:"IRM-"+String(S.seq++).padStart(4,"0"),

/* ---------- Export / Import ---------- */
function exportJson(){
  const blob = new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="REUTIB_IRM_Stand_"+new Date().toISOString().slice(0,10)+".json"; a.click();
}
function importJson(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const s=JSON.parse(r.result); if(!s.tickets) throw 0; S=s; save(); render(); }catch(e){ alert(tr("Datei konnte nicht gelesen werden.")); } };
  r.readAsText(f);
}
function exportCsv(list){
  const cols=S.lang==="en"
    ?["ID","Subject","Status","Lead domain","Site","Overall level","Escalation","Time of awareness","Created","Incident owner","Threat","TISAX","Open tasks"]
    :["ID","Betreff","Status","Leitdomäne","Standort","Gesamtstufe","Eskalation","Kenntniserlangung","Erstellt","Incident Owner","Gefährdung","TISAX","Offene Aufgaben"];
  const rows=list.map(t=>[t.id,t.betreff,tr(t.status),t.leitdomaene,siteLabel(t.standort),effStufe(t)||"",effEsk(t),fmt(t.kenntnis),fmt(t.erstellt),t.owner,gefLabel(t.gef),t.tisax?tr("ja"):tr("nein"),t.tasks.filter(x=>!x.done).length]);
  const csv=[cols,...rows].map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";")).join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"})); a.download="REUTIB_IRM_Tickets.csv"; a.click();
}

    .map(([k,l])=>`<button class="${S.tab===k?"active":""}" onclick="nav('${k}')">${tr(l)}</button>`).join("");
  const m=$("main");
  if(S.role==="melder" && S.tab!=="portal") S.tab="portal";
  if(S.detail){ m.innerHTML = viewDetail(S.detail); return; }
  switch(S.tab){
    case "portal": m.innerHTML=viewPortal(); break;

let F = {q:"",dom:"",st:"",stufe:"",ort:""};
function viewTickets(){
  const de = S.lang!=="en";
  const vis = S.tickets.filter(canSee);
  const list = vis.filter(t=>{
    if(F.q && !(t.id+" "+t.betreff+" "+t.beschreibung+" "+t.gef+" "+t.owner).toLowerCase().includes(F.q.toLowerCase())) return false;
    if(F.dom && t.leitdomaene!==F.dom) return false;
    if(F.st && t.status!==F.st) return false;

function openT(id){ S.detail=id; save(); render(); window.scrollTo(0,0); }

/* ---------- Ticketdetail ---------- */
function T(){ return S.tickets.find(x=>x.id===S.detail); }
function upd(field, value, label){
  const t=T(); if(!t||!canEdit(t)) return;
  const old=t[field];
  if(old===value) return;
  t[field]=value;
  const f=v=>field==="kenntnis"?fmt(v):String(v===undefined||v===""?"—":v);
  log(t, (label||field)+": "+f(old)+" → "+f(value));
  if(field==="kenntnis"){ syncTasks(t); }
  if(["s1","s2","s3","s4","s5","s6"].includes(field)){ vorrang(t); }
  if(field==="leitdomaene"){
    t.owner=ownerFor(t);
    if(isProtected(t)) log(t,tr("Ticket in den geschützten Arbeitsbereich verschoben. Triage-Rollen haben ab jetzt keinen Lesezugriff mehr.")+" ["+t[field]+"]");
  }
  save(); render();
}
function updPf(id, value){
  const t=T(); if(!t||!canEdit(t)) return;
  const p=PFL.find(x=>x.id===id);
  const old=t.pf[id]; if(old===value) return;
  t.pf[id]=value;
  log(t,tr("Meldepflicht")+" "+tr(p.l)+": "+tr(old)+" → "+tr(value));
  syncTasks(t);
  save(); render();
}
function setStatus(to){
  const t=T(); if(!t) return;
  if(t.status==="Closed" && S.role!=="isb"){ alert(tr("Wiedereröffnung nur durch den ISB.")); return; }
  const miss=checkTransition(t,to);
  if(miss.length){
    const de=S.lang!=="en";
    $("dlgBody").innerHTML=`<h2 style="margin-top:0">${tr("Statuswechsel nicht möglich")}</h2>
    <div class="err">${de?`Der Wechsel nach „${tr(to)}“ ist blockiert. Folgende Pflichtangaben fehlen:`:`The transition to “${tr(to)}” is blocked. The following mandatory entries are missing:`}</div>
    <ul>${miss.map(m=>`<li><b>${esc(m)}</b></li>`).join("")}</ul>
    <p class="small muted">${de?"Blockierende Pflichten werden nicht durch Erinnerungen ersetzt (GDL Kap. 10.1, Anhang B).":"Blocking obligations are never replaced by reminders (GDL ch. 10.1, Annex B)."}</p>`;
    $("dlg").showModal(); return;
  }
  const from=t.status; t.status=to;
  if(!t.erstreaktion && from==="Open"){ t.erstreaktion=now(); log(t,tr("Erstreaktion dokumentiert (Übernahme durch die Triage).")); }
  log(t,tr("Statuswechsel:")+" "+tr(from)+" → "+tr(to));
  afterTransition(t,to);
  save(); render();
}
function taskDone(tid){
  const t=T(); const task=t.tasks.find(x=>x.id===tid); if(!task) return;
  task.done=!task.done; task.doneTs=task.done?now():null;
  log(t,(task.done?tr("Aufgabe erledigt:"):tr("Aufgabe wieder geöffnet:"))+" "+taskLabel(task.name));
  save(); render();
}
function approve(idx, state){
  const t=T(); const a=t.approvals[idx]; if(!a) return;
  const need = a.by==="ISB"?"isb":"gl";
  if(S.role!==need){ alert(tr("Genehmigung nur durch: ")+tr(a.by)); return; }
  a.state=state; a.ts=now(); a.who=roleLabel();
  log(t,tr("Genehmigung")+" "+a.l+": "+tr(state)+" ("+tr(a.by)+")");
  if(a.key==="herab" && state==="genehmigt"){ t.herab="genehmigt"; log(t,tr("Herabstufung wirksam: Gesamtstufe jetzt")+" "+t.herabStufe+" (Override ISB)."); }
  if(a.key==="herab" && state==="abgelehnt"){ t.herab="abgelehnt"; t.herabStufe=""; }
  save(); render();
}
function requestHerab(){
  const t=T();
  const ziel=prompt(tr("Beantragte Zielstufe (P2, P3 oder P4):"),"P3");
  if(!ziel||!["P2","P3","P4"].includes(ziel.toUpperCase())) return;
  const begr=prompt(tr("Begründung der Herabstufung (Pflicht):"),""); if(!begr) return;
  t.herab="beantragt"; t.herabStufe=ziel.toUpperCase(); t.herabBegr=begr;
  t.einstufungBegr=(t.einstufungBegr?t.einstufungBegr+"\n":"")+fmt(now())+" "+tr("Herabstufung beantragt")+" → "+ziel.toUpperCase()+": "+begr;
  t.approvals.push({key:"herab", l:"Herabstufung "+computed(t).stufe+" → "+ziel.toUpperCase(), by:"ISB", state:"offen"});
  log(t,tr("Herabstufung beantragt")+" ("+ziel.toUpperCase()+"). "+tr("Gesamtstufe, Priorität und Reaktionszeit bleiben bis zur Entscheidung unverändert (GDL Kap. 10.3)."));
  save(); render();
}
function setE3(){
  const t=T();
  if(S.role!=="isb"){ alert(tr("E3 kann nur durch den ISB gesetzt werden.")); return; }
  if(!t.bcmNote){ alert(tr("Zuerst das Übergabeprotokoll BCM (Notiz) erfassen – ohne Notiz ist die Übergabe blockiert (Testfall 41).")); return; }
  t.eskOverride="E3";
  t.approvals.push({key:"bcm"+now(), l:"Übergabe an das BCM (E3) – Genehmigung", by:"Geschäftsleitung", state:"offen"});
  log(t,tr("Eskalationsstufe E3 gesetzt (ISB). Genehmigungsschritt der Geschäftsleitung angelegt; Meldeaufgaben laufen unabhängig weiter."));
  save(); render();
}

function toggleNeben(d, on){
  const t=T(); if(!t||!canEdit(t)) return;
  t.nebendomaenen = on ? [...new Set([...(t.nebendomaenen||[]),d])] : (t.nebendomaenen||[]).filter(x=>x!==d);
  if(on){
    log(t,tr("Nebendomäne gesetzt → Mitwirkungsaufgabe an den Incident Owner, Beobachterstatus (Regel 7).")+" ["+d+"]");
    addOnce(t,"neben_"+d,"Mitwirkung Nebendomäne "+d+" – "+DOM[d].n,"Incident Owner "+d,72);
    if(!t.beobachter.includes("Incident Owner "+d)) t.beobachter.push("Incident Owner "+d);
  } else log(t,tr("Nebendomäne entfernt.")+" ["+d+"]");
  save(); render();
}

/* ---------- Fristenmonitor ---------- */
function viewFristen(){
  const de = S.lang!=="en";
  const rows=[];
  for(const t of S.tickets.filter(canSee)){
    const st=effStufe(t);
    if(t.erstreaktion===null && st && !["Resolved","Closed"].includes(t.status)){
      const due=t.kenntnis+SLA_H[st]*3600000;
      rows.push({t, name:tr("Erstreaktion")+" ("+st+", "+SLA_H[st]+" h)", rolle:t.owner||"Triage", due, typ:"SLA"});
    }
    for(const x of t.tasks) if(!x.done && t.status!=="Closed") rows.push({t, name:taskLabel(x.name), rolle:tr(x.rolle), due:x.due, typ:x.origin.startsWith("nb")||x.origin.startsWith("neben")?tr("Aufgabe"):tr("Meldepflicht")});
  }
  rows.sort((a,b)=>a.due-b.due);
  const od=rows.filter(r=>r.due<now());
  return `<h1>${tr("Fristenmonitor")}</h1>
  <p class="muted">${de
   ?"Alle offenen Melde- und SLA-Fristen mit Restlaufzeit (Ampel: &gt;50 % grün · 50–75 % gelb · &gt;75 % orange · überschritten rot). Eskalationskette gem. GDL Kap. 9.2/11: 50 % → Incident Owner, 75 % → zusätzlich ISB, Überschreitung → zusätzlich Geschäftsleitung."
   :"All open notification and SLA deadlines with time remaining (traffic light: &gt;50 % green · 50–75 % yellow · &gt;75 % orange · breached red). Escalation chain per GDL ch. 9.2/11: 50 % → incident owner, 75 % → additionally ISB, breach → additionally executive management."}</p>
  <div class="kpis"><div class="kpi"><div class="v">${rows.length}</div><div class="l">${tr("offene Fristen")}</div></div>
  <div class="kpi"><div class="v" style="color:${od.length?"var(--crit)":"inherit"}">${od.length}</div><div class="l">${tr("überfällig (Fristverletzung → Monatsbericht)")}</div></div></div>
  ${rows.length?`<table><thead><tr><th></th><th>${tr("Ticket")}</th><th>${tr("Frist / Aufgabe")}</th><th>${tr("Typ")}</th><th>${tr("Zuständig")}</th><th>${tr("Fällig")}</th><th>${tr("Restlaufzeit")}</th></tr></thead><tbody>
  ${rows.map(r=>{
    const total = r.due-(r.t.kenntnis||r.due); const gone = now()-(r.t.kenntnis||now());
    const q = total>0? gone/total : 1;
    const amp = r.due<now()?"r":q>0.75?"o":q>0.5?"y":"g";
    return `<tr class="click" onclick="openT('${r.t.id}')"><td><span class="amp ${amp}"></span></td>
    <td><b>${r.t.id}</b> <span class="small muted">${esc(r.t.betreff.slice(0,40))}</span></td>
    <td>${esc(r.name)}</td><td class="small">${r.typ}</td><td class="small">${esc(r.rolle)}</td>
    <td class="small">${fmt(r.due)}</td><td>${r.due<now()?`<b style="color:var(--crit)">${fmtRest(r.due-now())}</b>`:fmtRest(r.due-now())}</td></tr>`;
  }).join("")}</tbody></table>`:`<div class="note">${tr("Keine offenen Fristen im sichtbaren Bereich.")}</div>`}`;
}

   <div class="kpi"><div class="v" style="color:${odTasks.length?"var(--crit)":"inherit"}">${odTasks.length}</div><div class="l">${de?"Meldeaufgaben überfällig":"notification tasks overdue"}</div></div>

   <div class="kpi"><div class="v">${nm.length}</div><div class="l">${de?"Beinaheereignisse (Meldequote-KPI)":"near misses (reporting-rate KPI)"}</div></div>
   <div class="kpi"><div class="v">${prot.length}</div><div class="l">${de?"geschützter Bereich (nur aggregiert)":"protected workspace (aggregate only)"}</div></div>
  </div>
  <h2>${de?"Lagebild Domänen":"Domain overview"} <span class="small muted">– ${de?"offene/gesamt je Domäne und Verteilung der Gesamtstufen":"open/total per domain and distribution of overall levels"}</span></h2>

  <div class="note"><b>Positioning:</b> This prototype implements the implementation recommendation <b>GDL_010.001 V1.00</b> (Freshservice implementation of Incident Response Management, 2026-08-01) as a runnable reference. It serves to validate the field, status and deadline model <b>before</b> the actual Freshservice configuration – it replaces neither a ticket system nor a server database (storage in the browser only; transfer via “Save/Load state”).</div>
  <h2>Covered requirements</h2>
  <table><thead><tr><th>GDL chapter</th><th>Requirement</th><th>Prototype implementation</th></tr></thead><tbody>

  <tr><td>6 / Annex A</td><td>Field model incl. S1–S6, reporting duties, business record, closure fields</td><td>Ticket detail, sections 1–5; obligations context-dependent (domain, site, level)</td></tr>

  <tr><td>4</td><td>Protected workspace domains E/I</td><td>Role simulation: triage/management/auditor lose read access after assignment to E/I; reports aggregate only</td></tr>
  <tr><td>8</td><td>Group/role model, watchers (ISB, secondary domains, DPO)</td><td>Role switcher (header), automatic watcher and owner pre-assignment</td></tr>
  <tr><td>10.2</td><td><b>Deadlines from time of awareness</b> incl. re-calculation after correction and justification duty &gt; 1 h</td><td>Time of awareness as deadline anchor; open notification tasks are re-scheduled on change (test cases 18/19)</td></tr>
  <tr><td>10.3</td><td>Approvals (downgrade, customer info, Sec. 35 BSIG, BCM); deadline clock keeps running</td><td>Approval list in the ticket; role binding ISB/management</td></tr>
  <tr><td>9/11</td><td>Response times P1–P4, escalation 50/75 %, notification triggers</td><td>Deadline monitor with traffic light; P1 banner (real alerting only in Freshservice)</td></tr>
