<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1283 2045" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6b85"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1283" height="2045" fill="#ffffff"/>

  <!-- arrows -->
  <g fill="none" stroke="#5a6b85" stroke-width="1.5" marker-end="url(#arr)">
    <path d="M123,92 C132,132 300,190 464,208"/>
    <path d="M383,92 C390,125 430,160 464,183"/>
    <path d="M643,92 L637,150"/>
    <path d="M903,92 C895,125 848,160 806,183"/>
    <path d="M1163,92 C1150,135 990,192 806,210"/>
    <path d="M635,292 L635,341"/>
    <path d="M635,482 L635,531"/>
    <path d="M690,700 C715,745 730,780 736,824"/>
    <path d="M590,700 C545,780 545,930 598,1016"/>
    <path d="M740,970 C740,1000 718,1010 692,1017"/>
    <path d="M635,1157 L635,1211"/>
    <path d="M700,1330 C765,1358 790,1378 790,1401"/>
    <path d="M725,1572 C650,1640 560,1682 502,1711"/>
    <path d="M380,1713 C350,1550 400,1420 496,1354"/>
    <path d="M800,1610 C812,1635 818,1655 820,1681"/>
    <path d="M830,1810 L830,1871"/>
  </g>

  <!-- edge labels -->
  <g font-size="15" fill="#33404f" text-anchor="middle">
    <text x="748" y="795">yes</text>
    <text x="548" y="895" text-anchor="end">no</text>
    <text x="638" y="1655" text-anchor="end">no</text>
    <text x="822" y="1652">yes</text>
  </g>

  <!-- source boxes -->
  <g fill="#e8eef6" stroke="#2c4a6e" stroke-width="2.5">
    <rect x="8" y="8" width="230" height="82"/>
    <rect x="268" y="8" width="230" height="82"/>
    <rect x="528" y="8" width="230" height="82"/>
    <rect x="788" y="8" width="230" height="82"/>
    <rect x="1048" y="8" width="230" height="82"/>
  </g>
  <g font-size="16" fill="#1f2d3d" text-anchor="middle">
    <text x="123" y="42">Internal audit /</text>
    <text x="123" y="64">external review</text>
    <text x="383" y="42">Provider assessment /</text>
    <text x="383" y="64">register, Art. 28-30</text>
    <text x="643" y="42">Incident and lessons</text>
    <text x="643" y="64">learned, Art. 13 / 17</text>
    <text x="903" y="42">Resilience test /</text>
    <text x="903" y="64">TLPT, Art. 24-26</text>
    <text x="1163" y="42">Self-assessment</text>
    <text x="1163" y="64">requirement catalog</text>
  </g>

  <!-- record finding -->
  <rect x="470" y="155" width="330" height="135" fill="#e8eef6" stroke="#2c4a6e" stroke-width="3"/>
  <g font-size="16" fill="#1f2d3d" text-anchor="middle">
    <text x="635" y="186" font-weight="bold">Record finding</text>
    <text x="635" y="212">ID, source, affected requirement,</text>
    <text x="635" y="234">affected CIF and assets,</text>
    <text x="635" y="256">description, date of finding</text>
  </g>

  <!-- risk classification -->
  <rect x="487" y="345" width="295" height="135" fill="#e8eef6" stroke="#2c4a6e" stroke-width="2.5"/>
  <g font-size="16" fill="#1f2d3d" text-anchor="middle">
    <text x="635" y="376" font-weight="bold">Risk classification</text>
    <text x="635" y="402">Severity critical / high /</text>
    <text x="635" y="424">medium / low based on impact</text>
    <text x="635" y="446">on critical functions</text>
  </g>

  <!-- risk appetite diamond -->
  <polygon points="635,535 740,640 635,745 530,640" fill="#faeedb" stroke="#b45f17" stroke-width="3"/>
  <g font-size="16" font-weight="bold" fill="#1f2d3d" text-anchor="middle">
    <text x="635" y="636">Risk appetite</text>
    <text x="635" y="658">exceeded?</text>
  </g>

  <!-- escalation -->
  <rect x="585" y="828" width="310" height="140" fill="#fdedec" stroke="#c0392b" stroke-width="3"/>
  <g font-size="16" fill="#1f2d3d" text-anchor="middle">
    <text x="740" y="859" font-weight="bold">Escalation to management body</text>
    <text x="740" y="885">Art. 5(2) - inform the</text>
    <text x="740" y="907">management body, if needed</text>
    <text x="740" y="929">suspend the affected function</text>
  </g>

  <!-- define CAPA -->
  <rect x="465" y="1020" width="340" height="135" fill="#e8eef6" stroke="#2c4a6e" stroke-width="3"/>
  <g font-size="16" fill="#1f2d3d" text-anchor="middle">
    <text x="635" y="1051" font-weight="bold">Define CAPA</text>
    <text x="635" y="1077">Corrective and preventive action,</text>
    <text x="635" y="1099">owner, due date, effort,</text>
    <text x="635" y="1121">effectiveness criterion</text>
  </g>

  <!-- implementation -->
  <rect x="483" y="1215" width="305" height="110" fill="#e8eef6" stroke="#2c4a6e" stroke-width="2.5"/>
  <g font-size="16" fill="#1f2d3d" text-anchor="middle">
    <text x="635" y="1249" font-weight="bold">Implementation</text>
    <text x="635" y="1276">Status tracking, milestones,</text>
    <text x="635" y="1298">follow-up, evidence filing</text>
  </g>

  <!-- effectiveness diamond -->
  <polygon points="790,1405 900,1510 790,1615 680,1510" fill="#faeedb" stroke="#b45f17" stroke-width="3"/>
  <g font-size="16" font-weight="bold" fill="#1f2d3d" text-anchor="middle">
    <text x="790" y="1506">Effectiveness</text>
    <text x="790" y="1528">proven?</text>
  </g>

  <!-- follow-up -->
  <rect x="300" y="1715" width="340" height="110" fill="#fdedec" stroke="#c0392b" stroke-width="3"/>
  <g font-size="16" fill="#1f2d3d" text-anchor="middle">
    <text x="470" y="1749" font-weight="bold">Follow-up</text>
    <text x="470" y="1776">Extend due date, adjust action,</text>
    <text x="470" y="1798">raise escalation level</text>
  </g>

  <!-- close finding -->
  <rect x="690" y="1685" width="280" height="125" fill="#eaf3ee" stroke="#3a7d54" stroke-width="3"/>
  <g font-size="16" fill="#1f2d3d" text-anchor="middle">
    <text x="830" y="1716" font-weight="bold">Close finding</text>
    <text x="830" y="1742">Re-assess maturity level,</text>
    <text x="830" y="1764">version evidence,</text>
    <text x="830" y="1786">audit trail immutable</text>
  </g>

  <!-- feedback to dashboard -->
  <rect x="670" y="1875" width="320" height="125" fill="#eaf3ee" stroke="#3a7d54" stroke-width="3"/>
  <g font-size="16" fill="#1f2d3d" text-anchor="middle">
    <text x="830" y="1906" font-weight="bold">Feedback to dashboard</text>
    <text x="830" y="1932">Chapter score, traffic light,</text>
    <text x="830" y="1954">KRI open findings by age</text>
  </g>
</svg>
