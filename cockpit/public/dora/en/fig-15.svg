  <text x="695" y="1212" font-size="25" fill="#1f2937" text-anchor="middle">Deadlines</text>
  <text x="695" y="1252" font-size="28" font-style="italic" fill="#1f2937" text-anchor="middle">SOC &amp; CISO</text>
