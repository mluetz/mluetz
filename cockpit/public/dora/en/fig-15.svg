  <text x="695" y="1505" font-size="28" font-style="italic" fill="#1f2937" text-anchor="middle">Test coordination</text>
  <rect x="1090" y="1383" width="790" height="145" fill="#e9edf6" stroke="#16405e" stroke-width="3"/>
  <text x="1485" y="1440" font-size="26" fill="#1f2937" text-anchor="middle">Test calendar, transfer of results into findings,</text>
  <text x="1485" y="1480" font-size="26" fill="#1f2937" text-anchor="middle">TLPT cycle monitoring, attestation filing</text>

  <!-- View 7 -->
  <rect x="505" y="1630" width="380" height="190" fill="#e8f1ea" stroke="#2f6b4f" stroke-width="3"/>
  <text x="695" y="1685" font-size="28" font-weight="bold" fill="#1f2937" text-anchor="middle">View 7</text>
  <text x="695" y="1730" font-size="28" fill="#1f2937" text-anchor="middle">Reporting &amp; Export</text>
