<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1958 1854" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#45586e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1958" height="1854" fill="#ffffff"/>

  <!-- Root box -->
  <rect x="15" y="845" width="360" height="140" fill="#16405e" stroke="#0d2b41" stroke-width="2"/>
  <text x="195" y="907" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">DORA Dashboard</text>
  <text x="195" y="945" font-size="28" font-style="italic" fill="#dce7ef" text-anchor="middle">Application frame</text>

  <!-- Connectors root -> views -->
  <g fill="none" stroke="#45586e" stroke-width="2">
    <path d="M 220 841 C 240 500, 330 200, 496 110" marker-end="url(#arr)"/>
    <path d="M 245 841 C 280 600, 360 440, 496 380" marker-end="url(#arr)"/>
    <path d="M 290 841 C 340 730, 400 680, 496 650" marker-end="url(#arr)"/>
    <path d="M 379 915 L 496 915" marker-end="url(#arr)"/>
    <path d="M 290 989 C 340 1100, 400 1150, 496 1185" marker-end="url(#arr)"/>
    <path d="M 245 989 C 280 1230, 360 1400, 496 1455" marker-end="url(#arr)"/>
    <path d="M 220 989 C 240 1330, 330 1630, 496 1720" marker-end="url(#arr)"/>
  </g>

  <!-- Lines views -> feature boxes -->
  <g stroke="#45586e" stroke-width="2">
