    <line x1="885" y1="375" x2="1130" y2="375"/>
    <line x1="885" y1="645" x2="1105" y2="645"/>
    <line x1="885" y1="915" x2="1060" y2="915"/>
    <line x1="885" y1="1185" x2="1015" y2="1185"/>
    <line x1="885" y1="1455" x2="1090" y2="1455"/>
