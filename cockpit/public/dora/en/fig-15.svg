  <text x="1475" y="90" font-size="26" fill="#1f2937" text-anchor="middle">KPI tiles, chapter traffic light, trend chart,</text>
  <text x="1475" y="130" font-size="26" fill="#1f2937" text-anchor="middle">CIF heatmap, reporting-deadline monitor</text>

