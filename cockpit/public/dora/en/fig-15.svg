  <rect x="1125" y="1653" width="720" height="145" fill="#e8f1ea" stroke="#2f6b4f" stroke-width="3"/>
  <text x="1485" y="1710" font-size="26" fill="#1f2937" text-anchor="middle">Evidence package as PDF, management report,</text>
  <text x="1485" y="1750" font-size="26" fill="#1f2937" text-anchor="middle">audit-trail export for internal audit and supervisors</text>
