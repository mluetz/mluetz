<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1732 2047" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4.5 L0,9 z" fill="#44546a"/>
    </marker>
    <marker id="arrowDash" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4.5 L0,9 z" fill="#5a6b7f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1732" height="2047" fill="#ffffff"/>

  <!-- solid arrows -->
  <!-- 1 Attack vectors: Chapter VI -> diamond top -->
  <path d="M 930 243 C 1030 295, 1090 330, 1122 378" fill="none" stroke="#44546a" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- 2 Provider risks: Chapter V -> diamond right edge -->
  <path d="M 1385 1815 C 1590 1730, 1610 1250, 1338 985" fill="none" stroke="#44546a" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- 3 Test scope: diamond -> Chapter IV -->
  <path d="M 1055 1090 C 1030 1185, 1035 1285, 1060 1372" fill="none" stroke="#44546a" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- 4 Test findings: Chapter IV -> diamond -->
  <path d="M 1210 1378 C 1242 1280, 1245 1185, 1218 1092" fill="none" stroke="#44546a" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- 5 BCP and DRP: diamond -> Chapter III -->
  <path d="M 845 950 C 500 1140, 205 1195, 233 1370" fill="none" stroke="#44546a" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- 6 Lessons learned: Chapter III -> diamond -->
  <path d="M 385 1375 C 480 1240, 700 1075, 885 940" fill="none" stroke="#44546a" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- dashed arrows -->
  <!-- 7 Contract review: Chapter III -> Chapter V -->
  <path d="M 370 1630 C 420 1725, 650 1812, 875 1852" fill="none" stroke="#5a6b7f" stroke-width="2.5" stroke-dasharray="4 8" marker-end="url(#arrowDash)"/>
  <!-- 8 Cyber threat: Chapter III -> Chapter VI -->
  <path d="M 520 1340 C 555 1000, 560 550, 622 252" fill="none" stroke="#5a6b7f" stroke-width="2.5" stroke-dasharray="4 8" marker-end="url(#arrowDash)"/>
  <!-- 9 Providers in testing: Chapter IV -> Chapter V -->
  <path d="M 1130 1630 L 1130 1762" fill="none" stroke="#5a6b7f" stroke-width="2.5" stroke-dasharray="4 8" marker-end="url(#arrowDash)"/>

  <!-- Chapter VI box -->
  <rect x="520" y="15" width="430" height="230" fill="#e9edf6" stroke="#1f3a5f" stroke-width="4"/>
  <text x="735" y="80" font-size="30" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Chapter VI &#8211; Art. 45</text>
  <text x="735" y="124" font-size="28" fill="#333333" text-anchor="middle">Information sharing</text>
  <text x="735" y="164" font-size="28" fill="#333333" text-anchor="middle">Threat intelligence,</text>
  <text x="735" y="204" font-size="28" fill="#333333" text-anchor="middle">external threat landscape</text>

  <!-- Chapter II diamond -->
  <polygon points="1130,390 1520,780 1130,1170 740,780" fill="#fbf1de" stroke="#c05a11" stroke-width="5"/>
  <text x="1130" y="688" font-size="30" font-weight="bold" fill="#333333" text-anchor="middle">Chapter II &#8211; Art. 5-16</text>
  <text x="1130" y="730" font-size="27" fill="#333333" text-anchor="middle">ICT risk management</text>
  <text x="1130" y="766" font-size="27" fill="#333333" text-anchor="middle">and governance</text>
  <text x="1130" y="804" font-size="27" font-style="italic" fill="#333333" text-anchor="middle">Central steering</text>
  <text x="1130" y="842" font-size="27" fill="#333333" text-anchor="middle">Risk register, risk appetite,</text>
  <text x="1130" y="878" font-size="26" fill="#333333" text-anchor="middle">responsibility of the management body</text>

  <!-- Chapter III box -->
  <rect x="133" y="1378" width="475" height="250" fill="#eaf4ee" stroke="#2e7d5b" stroke-width="4"/>
  <text x="370" y="1444" font-size="30" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Chapter III &#8211; Art. 17-23</text>
  <text x="370" y="1489" font-size="28" fill="#333333" text-anchor="middle">Incident management</text>
  <text x="370" y="1530" font-size="28" fill="#333333" text-anchor="middle">Classification, reporting,</text>
  <text x="370" y="1571" font-size="28" fill="#333333" text-anchor="middle">root cause analysis</text>

  <!-- Chapter IV box -->
  <rect x="870" y="1378" width="520" height="250" fill="#eaf4ee" stroke="#2e7d5b" stroke-width="4"/>
  <text x="1130" y="1444" font-size="30" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Chapter IV &#8211; Art. 24-27</text>
  <text x="1130" y="1489" font-size="28" fill="#333333" text-anchor="middle">Resilience testing</text>
  <text x="1130" y="1530" font-size="28" fill="#333333" text-anchor="middle">Vulnerability scans, scenario</text>
  <text x="1130" y="1571" font-size="28" fill="#333333" text-anchor="middle">tests, TLPT every three years</text>

  <!-- Chapter V box -->
  <rect x="885" y="1770" width="495" height="250" fill="#e9edf6" stroke="#1f3a5f" stroke-width="4"/>
  <text x="1132" y="1836" font-size="30" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Chapter V &#8211; Art. 28-30</text>
  <text x="1132" y="1881" font-size="28" fill="#333333" text-anchor="middle">ICT third-party risk</text>
  <text x="1132" y="1922" font-size="26" fill="#333333" text-anchor="middle">Register of information, contracts,</text>
  <text x="1132" y="1963" font-size="28" fill="#333333" text-anchor="middle">concentration risk</text>

  <!-- numbered labels -->
  <rect x="985" y="285" width="245" height="42" fill="#ffffff"/>
  <text x="1107" y="316" font-size="28" fill="#333333" text-anchor="middle">1 Attack vectors</text>

  <rect x="1435" y="1490" width="250" height="42" fill="#ffffff"/>
  <text x="1560" y="1521" font-size="28" fill="#333333" text-anchor="middle">2 Provider risks</text>

  <rect x="915" y="1226" width="200" height="42" fill="#ffffff"/>
  <text x="1015" y="1257" font-size="28" fill="#333333" text-anchor="middle">3 Test scope</text>

  <rect x="1155" y="1226" width="230" height="42" fill="#ffffff"/>
  <text x="1270" y="1257" font-size="28" fill="#333333" text-anchor="middle">4 Test findings</text>

  <rect x="10" y="1270" width="230" height="42" fill="#ffffff"/>
  <text x="20" y="1301" font-size="28" fill="#333333">5 BCP and DRP</text>

  <rect x="455" y="1076" width="285" height="42" fill="#ffffff"/>
  <text x="597" y="1107" font-size="28" fill="#333333" text-anchor="middle">6 Lessons learned</text>

  <rect x="230" y="1688" width="280" height="42" fill="#ffffff"/>
  <text x="370" y="1719" font-size="28" fill="#333333" text-anchor="middle">7 Contract review</text>

  <rect x="435" y="748" width="235" height="42" fill="#ffffff"/>
  <text x="552" y="779" font-size="28" fill="#333333" text-anchor="middle">8 Cyber threat</text>

  <rect x="945" y="1672" width="330" height="42" fill="#ffffff"/>
  <text x="1110" y="1703" font-size="28" fill="#333333" text-anchor="middle">9 Providers in testing</text>
</svg>
