# ============================================================
# ICT & TPRM Cockpit – Synology NAS (Container Manager, DSM 7)
# ------------------------------------------------------------
# Ein-Container-Betrieb mit SQLite in einem Docker-Volume.
# Die Demo-Datenbank wird beim ersten Start automatisch angelegt.
#
# Vorbereitung (einmalig): im selben Ordner eine Datei ".env" mit
#   SESSION_SECRET=<zufälliger Wert, mind. 32 Zeichen>
# anlegen. Anleitung: docs/operations/synology.md
#
# Aufruf danach: http://<NAS-IP>:3000  (z. B. http://192.168.178.97:3000)
# ============================================================

services:
  cockpit:
    build:
      context: .
      # Build-Schritte im Host-Netzwerk ausführen: Auf DSM haben Build-
      # Container im Standard-Bridge-Netz häufig keinen funktionierenden
      # Internetzugang (DNS/MTU) – Downloads wie die Prisma-Engine hängen
      # dann endlos, obwohl der NAS-Host selbst online ist.
      network: host
    image: ict-tprm-cockpit:latest
    container_name: ict-tprm-cockpit
    ports:
      # Host-Port über HOST_PORT in der .env änderbar (Standard 3000),
      # falls 3000 auf dem NAS bereits belegt ist.
      - "${HOST_PORT:-3000}:3000"
    environment:
      DATABASE_URL: "file:/data/cockpit.db"
      SESSION_SECRET: "${SESSION_SECRET:?SESSION_SECRET in .env setzen (mind. 32 Zeichen)}"
      AUTH_DEMO_LOGIN: "${AUTH_DEMO_LOGIN:-true}"
      # Vom Installer mit der echten NAS-IP und dem gewählten Port gefüllt.
      # Das Protokoll steuert das Secure-Flag des Session-Cookies (siehe
      # lib/auth/cookie-policy.ts): über http:// darf es nicht gesetzt werden.
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost:${HOST_PORT:-3000}}"
      # Optionaler Override, falls das Flag manuell erzwungen werden soll:
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-}"
    volumes:
      - cockpit-data:/data
    restart: unless-stopped

volumes:
  cockpit-data:
