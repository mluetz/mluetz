<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protected Area</title>
<style>
:root{
  --bg1:#33525c; --bg2:#22404b; --cy:#3ee0ea; --cy-dim:#6cb9c4;
  --card:#132b33f2; --card-b:#2e5b66; --ink:#e8f4f6; --ink-2:#9fc3ca; --err:#ff9f8a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.veil{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(10,30,37,.18),rgba(8,24,30,.62) 78%)}
.stage{position:relative;z-index:2;height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(400px,94vw);background:var(--card);border:1px solid var(--card-b);border-radius:16px;
  padding:30px 30px 24px;box-shadow:0 18px 60px rgba(0,10,14,.55),0 0 0 1px rgba(62,224,234,.06),0 0 42px rgba(62,224,234,.10);
  backdrop-filter:blur(9px)}
h1.quote{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:600;
  font-style:italic;font-size:20.5px;margin:2px 0 18px;letter-spacing:-.01em;line-height:1.4;
  text-align:center;text-wrap:balance;color:var(--cy)}
label{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--cy-dim);
  font-weight:700;margin:14px 0 5px}
input{width:100%;padding:11px 13px;border-radius:9px;border:1px solid #33606c;background:#0d222a;
  color:var(--ink);font-size:15px}
input:focus{outline:2px solid var(--cy);outline-offset:1px;border-color:var(--cy)}
button.go{width:100%;margin-top:22px;padding:12px;border:none;border-radius:9px;cursor:pointer;
  background:linear-gradient(180deg,#3ee0ea,#25b7c4);color:#062226;font-size:15px;font-weight:700;letter-spacing:.02em}
button.go:hover{filter:brightness(1.07)}
button.go:disabled{opacity:.55;cursor:wait}
.err{display:none;margin-top:13px;font-size:13px;color:var(--err);text-align:center}
.err.show{display:block}
.foot{margin-top:20px;padding-top:14px;border-top:1px solid #24444e;font-size:11px;color:#7799a1;
  line-height:1.6;text-align:center}
.card.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.card.shake{animation:none}}
</style>
</head>

const SK="reutib-vault-k1";
const lang=(new URLSearchParams(location.search).get("lang")==="en")?"en":"de";
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function deriveKey(user,pass){
  const mat=await crypto.subtle.importKey("raw",
    new TextEncoder().encode(user.trim().toLowerCase()+"\u0000"+pass),
    "PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:b64d(VAULT.salt),iterations:VAULT.iter,hash:"SHA-256"},
    mat,{name:"AES-GCM",length:256},true,["decrypt"]);
}

async function openLang(key,lg){
  const p=VAULT.payloads[lg]||VAULT.payloads.de;
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(p.nonce)},key,b64d(p.ct));
  const stream=new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"));
  let html=await new Response(stream).text();
  html=html.replace('href="register-en.html"','href="index.html?lang=en"')
           .replace('href="register-de.html"','href="index.html?lang=de"');
  const lockLbl=lg==="en"?"Lock":"Sperren";
  html=html.replace("</body>",
    `<button style="position:fixed;bottom:16px;right:16px;z-index:99;background:#132b33;color:#7fd6dc;border:1px solid #35707c;border-radius:20px;padding:8px 14px;font:600 12.5px system-ui;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.35)" onclick="sessionStorage.removeItem('${SK}');location.href='index.html'">\u{1F512} ${lockLbl}</button></body>`);
  document.open(); document.write(html); document.close();
}

(async()=>{
  const saved=sessionStorage.getItem(SK);
  if(!saved) return;
  try{
    const key=await crypto.subtle.importKey("jwk",JSON.parse(saved),{name:"AES-GCM"},true,["decrypt"]);
    await openLang(key,lang);
  }catch(e){ sessionStorage.removeItem(SK); }
})();

document.getElementById("loginForm").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const btn=document.getElementById("goBtn"), err=document.getElementById("err"),
        card=document.querySelector(".card");
  err.classList.remove("show"); btn.disabled=true;
  try{
    const key=await deriveKey(document.getElementById("u").value,document.getElementById("p").value);
    await openLang(key,lang);
    sessionStorage.setItem(SK,JSON.stringify(await crypto.subtle.exportKey("jwk",key)));
  }catch(e){
    btn.disabled=false;
    err.classList.add("show");
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    document.getElementById("p").value=""; document.getElementById("p").focus();
  }
});
</script>
</body>
</html>
